<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="790" viewBox="0 0 1000 790" style="max-width:100vw;max-height:100vh" role="img" aria-labelledby="title desc">
  <title id="title">第四层地痞据点平面草图</title>
  <desc id="desc">九乘九格室内，入口在下方。后墙有座位和看场桌，头目站在桌前。两个可搜赃物容器在后侧，两边有固定货堆，中央保留五乘五格交手空间。</desc>
  <defs>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse" x="60" y="125">
      <path d="M60 0H0V60" fill="none" stroke="#d2cabc" stroke-width="1"/>
    </pattern>
    <style>
      text { font-family: 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif; fill: #332f29; }
      .small { font-size: 15px; }
      .label { font-size: 17px; text-anchor: middle; dominant-baseline: middle; }
      .note { font-size: 17px; }
    </style>
  </defs>
  <rect width="1000" height="790" fill="#f5f1e7"/>
  <text x="60" y="54" font-size="29" font-weight="bold">第四层 · 地痞据点</text>
  <text x="60" y="88" font-size="17" fill="#6b6255">首版布局建议 · 9×9格室内 · 地图位置随机，每次必出一间</text>
  <rect x="60" y="125" width="540" height="540" fill="#e5dfd3"/>
  <rect x="180" y="245" width="300" height="300" fill="#d7e2d2"/>
  <rect x="60" y="545" width="540" height="120" fill="#e8e5da"/>
  <rect x="240" y="125" width="120" height="120" fill="#b9a38d" opacity=".4"/>
  <rect x="60" y="125" width="540" height="540" fill="url(#grid)"/>
  <rect x="60" y="125" width="540" height="540" fill="none" stroke="#514b41" stroke-width="9"/>
  <path d="M300 665H360" stroke="#f5f1e7" stroke-width="13"/>
  <path d="M300 669H360" stroke="#8c7150" stroke-width="8"/>
  <rect x="180" y="245" width="300" height="300" rx="3" fill="none" stroke="#6d8569" stroke-width="2" stroke-dasharray="8 6"/>
  <rect x="308" y="132" width="44" height="45" rx="7" fill="#9e876d" stroke="#695943" stroke-width="2"/>
  <path d="M312 140H348" stroke="#695943" stroke-width="5"/>
  <text x="330" y="159" class="label" font-size="15">座位</text>
  <rect x="244" y="191" width="112" height="48" rx="3" fill="#bba180" stroke="#79644d" stroke-width="2"/>
  <text x="300" y="215" class="label">看场桌</text>
  <rect x="126" y="191" width="48" height="48" rx="3" fill="#c6a85f" stroke="#897037" stroke-width="2"/>
  <text x="150" y="215" class="label">赃物</text>
  <rect x="486" y="191" width="48" height="48" rx="3" fill="#c6a85f" stroke="#897037" stroke-width="2"/>
  <text x="510" y="215" class="label">赃物</text>
  <rect x="67" y="311" width="46" height="108" rx="3" fill="#a49984" stroke="#746b5b" stroke-width="2"/>
  <text x="90" y="353" class="label">货</text><text x="90" y="380" class="label">堆</text>
  <rect x="547" y="311" width="46" height="108" rx="3" fill="#a49984" stroke="#746b5b" stroke-width="2"/>
  <text x="570" y="353" class="label">货</text><text x="570" y="380" class="label">架</text>
  <circle cx="330" cy="275" r="23" fill="#9c5145" stroke="#693a33" stroke-width="2"/>
  <text x="330" y="275" class="label" style="fill:#fff8ed">头目</text>
  <path d="M330 306V331M322 323L330 331L338 323" fill="none" stroke="#9c5145" stroke-width="2"/>
  <text x="330" y="405" class="label" style="font-size:22px;fill:#4d6549">中央交手区</text>
  <text x="330" y="437" class="label" style="fill:#4d6549">5×5格连续空地</text>
  <text x="330" y="605" class="label" style="fill:#766c5b">入口留空 · 两排</text>
  <text x="330" y="708" class="label">旧铁门 · 门外地痞涂记</text>
  <text x="330" y="741" class="small" text-anchor="middle">室外道路可以绕开整间据点，直接前往通行口</text>
  <text x="655" y="154" font-size="22" font-weight="bold">空间重点</text>
  <text x="655" y="198" class="note">后部：头目的位置</text>
  <text x="655" y="228" class="small">桌、椅、地毯组成固定场景。</text>
  <text x="655" y="255" class="small">头目站在桌前，面朝入口。</text>
  <text x="655" y="309" class="note">两侧：赃物与障碍</text>
  <text x="655" y="339" class="small">金色是可搜容器，共两个。</text>
  <text x="655" y="366" class="small">灰褐色货堆只作阻挡。</text>
  <text x="655" y="420" class="note">中央：周旋与爆发</text>
  <text x="655" y="450" class="small">留出进退、催气冲进和膝撞空间。</text>
  <text x="655" y="477" class="small">靠近边墙及家具时，撞阻风险增加。</text>
  <text x="655" y="546" class="note">战斗仍由玩家选择</text>
  <text x="655" y="577" class="small">不开门可绕行；开战不锁门。</text>
  <text x="655" y="604" class="small">开门后按真实视野发现与追击。</text>
  <text x="655" y="631" class="small">只部署头目一人。</text>
  <text x="655" y="716" class="small" style="fill:#827565">平面示意，不代表最终游戏美术。</text>
  <text x="655" y="742" class="small" style="fill:#827565">尺寸和容器数量为首版建议。</text>
</svg>
