<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>交易 UI Demo</title>
    <style>
      :root {
        color-scheme: dark;
      }
      body {
        margin: 0;
        padding: 0;
        background: #1c1815;
        color: #e8e6e3;
        font-family: "Microsoft YaHei", "微软雅黑", "PingFang SC", "Noto Sans CJK SC",
          system-ui, sans-serif;
        overflow: hidden;
      }
      #canvas-container {
        width: 100vw;
        height: 100vh;
        position: relative;
      }
      canvas {
        display: block;
        background: #1c1815;
        width: 100%;
        height: 100%;
      }
      #trade-step-input {
        position: absolute;
        display: none;
        z-index: 10;
        padding: 6px 10px;
        background: #26211d;
        border: 2px solid #d4a373;
        border-radius: 8px;
        color: #e8e6e3;
        font-family: "Microsoft YaHei", "微软雅黑", "PingFang SC", "Noto Sans CJK SC",
          system-ui, sans-serif;
        font-size: 18px;
        line-height: 1;
        text-align: center;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
        outline: none;
      }
      #trade-step-input:focus {
        border-color: #fbbf24;
      }
    </style>
  </head>
  <body>
    <div id="canvas-container">
      <canvas id="tradeCanvas"></canvas>
      <input id="trade-step-input" inputmode="numeric" autocomplete="off" spellcheck="false" />
    </div>

    <script type="module">
      import {
        createTradeContext,
      } from "./js/trade_context.js";
      import {
        createTradeUIState,
        refreshTradeUILayout,
      } from "./js/trade_canvas_ui.js";
      import {
        createDemoRenderer,
        bindDemoRendererWithState,
      } from "./js/trade_canvas_renderer_demo.js";

      /**
       * 简单的 valueCalculator：直接返回 baseValue。
       *
       * @param {import("./js/trade_context.js").TradeItem} item
       * @returns {number}
       */
      function valueCalculator(item) {
        return item.baseValue || 0;
      }

      /**
       * Demo 版感受词计算：
       * - 计算玩家给出/获得与商人给出/获得的总价值
       * - 用简单区间将玩家视角盈亏映射为五档感受词
       *
       * @param {import("./js/trade_context.js").TradeContext} context
       * @returns {import("./js/trade_context.js").PerceivedFeelingResult}
       */
      function feelingCalculator(context) {
        let V_player_give = 0;
        let V_player_get = 0;
        let V_merchant_give = 0;
        let V_merchant_get = 0;

        const { pendingGivePlayer, pendingGetPlayer, pendingGiveMerchant, pendingGetMerchant } =
          context;

        for (const itemId in pendingGivePlayer) {
          const p = pendingGivePlayer[itemId];
          if (!p || !p.count) continue;
          const row = findRowForItem(context.playerInventory, itemId);
          if (!row) continue;
          V_player_give +=
            (context.valueCalculator(row.item, context) || 0) * p.count;
        }

        for (const itemId in pendingGetPlayer) {
          const p = pendingGetPlayer[itemId];
          if (!p || !p.count) continue;
          const row =
            findRowForItem(context.playerInventory, itemId) ||
            findRowForItem(context.merchantInventory, itemId);
          if (!row) continue;
          V_player_get +=
            (context.valueCalculator(row.item, context) || 0) * p.count;
        }

        for (const itemId in pendingGiveMerchant) {
          const p = pendingGiveMerchant[itemId];
          if (!p || !p.count) continue;
          const row = findRowForItem(context.merchantInventory, itemId);
          if (!row) continue;
          V_merchant_give +=
            (context.valueCalculator(row.item, context) || 0) * p.count;
        }

        for (const itemId in pendingGetMerchant) {
          const p = pendingGetMerchant[itemId];
          if (!p || !p.count) continue;
          const row =
            findRowForItem(context.merchantInventory, itemId) ||
            findRowForItem(context.playerInventory, itemId);
          if (!row) continue;
          V_merchant_get +=
            (context.valueCalculator(row.item, context) || 0) * p.count;
        }

        const playerDelta = V_player_get - V_player_give;
        const merchantDelta = V_merchant_get - V_merchant_give;

        function mapDeltaToFeeling(delta) {
          if (delta <= -50) return "不行";
          if (delta < 0) return "略亏";
          if (delta === 0) return "可以";
          if (delta < 50) return "略赚";
          return "很赚";
        }

        return {
          playerFeeling: mapDeltaToFeeling(playerDelta),
          merchantFeeling: mapDeltaToFeeling(merchantDelta),
          valueSummary: {
            V_player_give,
            V_player_get,
            V_merchant_give,
            V_merchant_get,
          },
        };
      }

      /**
       * 在给定库存中查找 itemId 对应的行。
       *
       * @param {import("./js/trade_context.js").TradeInventoryRow[]} inventory
       * @param {string} itemId
       */
      function findRowForItem(inventory, itemId) {
        for (let i = 0; i < inventory.length; i += 1) {
          const row = inventory[i];
          if (row.item && row.item.itemId === itemId) {
            return row;
          }
        }
        return null;
      }

      /**
       * Demo 版结算逻辑：
       * - 计算玩家给出的总价值 totalSell
       * - 若 totalSell > 1000 且 !forceCommit，则返回 needConfirm=true
       * - 否则视为成功结算：清空所有 pending*，不改动 availableCount
       *
       * @param {import("./js/trade_context.js").TradeContext} context
       * @param {{ forceCommit: boolean }} options
       * @returns {import("./js/trade_canvas_ui.js").CommitTradeResult}
       */
      function tryCommitTrade(context, { forceCommit }) {
        let totalSell = 0;
        for (const itemId in context.pendingGivePlayer) {
          const p = context.pendingGivePlayer[itemId];
          if (!p || !p.count) continue;
          const row =
            findRowForItem(context.playerInventory, itemId) ||
            findRowForItem(context.merchantInventory, itemId);
          if (!row) continue;
          totalSell +=
            (context.valueCalculator(row.item, context) || 0) * p.count;
        }

        const THRESHOLD = 1000;
        if (!forceCommit && totalSell > THRESHOLD) {
          return {
            committed: false,
            needConfirm: true,
            errorCode: "NEED_CONFIRM",
          };
        }

        // 成功结算：按 pending 把双方库存做加减，并清空 pending。
        // （本 demo 仅做最小正确性：不处理限额/资金池/商誉等复杂规则）

        /**
         * @param {import("./js/trade_context.js").TradeInventoryRow[]} inventory
         * @param {import("./js/trade_context.js").TradeItem} item
         */
        function ensureRow(inventory, item) {
          const existing = findRowForItem(inventory, item.itemId);
          if (existing) return existing;
          const cloneItem = { ...item };
          const row = { item: cloneItem, availableCount: 0, tradeLocked: false };
          inventory.push(row);
          return row;
        }

        // 玩家给出 -> 玩家减、商人加
        for (const itemId in context.pendingGivePlayer) {
          const p = context.pendingGivePlayer[itemId];
          const cnt = (p?.count || 0) | 0;
          if (cnt <= 0) continue;
          const from = findRowForItem(context.playerInventory, itemId);
          if (!from) continue;
          from.item.stackCount = Math.max(0, (from.item.stackCount | 0) - cnt);
          const to = ensureRow(context.merchantInventory, from.item);
          to.item.stackCount = (to.item.stackCount | 0) + cnt;
        }

        // 玩家要取 -> 商人减、玩家加
        for (const itemId in context.pendingGetPlayer) {
          const p = context.pendingGetPlayer[itemId];
          const cnt = (p?.count || 0) | 0;
          if (cnt <= 0) continue;
          const from = findRowForItem(context.merchantInventory, itemId);
          if (!from) continue;
          from.item.stackCount = Math.max(0, (from.item.stackCount | 0) - cnt);
          const to = ensureRow(context.playerInventory, from.item);
          to.item.stackCount = (to.item.stackCount | 0) + cnt;
        }

        // 结算后：用 stackCount 重置会话可用数量（availableCount）
        for (const row of context.playerInventory) {
          if (!row || !row.item) continue;
          row.availableCount = row.item.stackCount | 0;
        }
        for (const row of context.merchantInventory) {
          if (!row || !row.item) continue;
          row.availableCount = row.item.stackCount | 0;
        }

        context.pendingGivePlayer = {};
        context.pendingGetPlayer = {};
        context.pendingGiveMerchant = {};
        context.pendingGetMerchant = {};

        return {
          committed: true,
          needConfirm: false,
        };
      }

      function initDemo() {
        const canvas = /** @type {HTMLCanvasElement|null} */ (
          document.getElementById("tradeCanvas")
        );
        if (!canvas) {
          console.error("找不到 tradeCanvas");
          return;
        }

        function resizeCanvas() {
          const dpr = window.devicePixelRatio || 1;
          const w = Math.max(1, Math.floor(window.innerWidth * dpr));
          const h = Math.max(1, Math.floor(window.innerHeight * dpr));
          if (canvas.width !== w) canvas.width = w;
          if (canvas.height !== h) canvas.height = h;
        }

        resizeCanvas();

        /** @type {import("./js/trade_context.js").MerchantProfile} */
        const merchant = {
          id: "merchant_demo",
          name: "示例商人",
          merchantType: "shopkeeper",
          attitude: "neutral",
          priceBias: 1.0,
          preferredTags: ["food"],
          dislikedTags: ["junk"],
          acceptedCurrencyCodes: ["创世结晶"],
          baseFundsPool: 5000,
          currentFundsPool: 5000,
        };

        /** @type {import("./js/trade_context.js").TradeInventoryRow[]} */
        const playerInventory = [
          {
            item: {
              itemId: "apple",
              displayName: "苹果",
              stackCount: 10,
              baseValue: 20,
              tags: ["food"],
              isCurrency: false,
            },
            availableCount: 10,
            tradeLocked: false,
          },
          {
            item: {
              itemId: "junk_scrap",
              displayName: "废铁",
              stackCount: 30,
              baseValue: 5,
              tags: ["junk"],
              isCurrency: false,
            },
            availableCount: 30,
            tradeLocked: false,
          },
          {
            item: {
              itemId: "currency_base",
              displayName: "创世结晶",
              stackCount: 140,
              baseValue: 1,
              tags: ["currency"],
              isCurrency: true,
            },
            availableCount: 140,
            tradeLocked: false,
          },
        ];

        /** @type {import("./js/trade_context.js").TradeInventoryRow[]} */
        const merchantInventory = [
          {
            item: {
              itemId: "bread",
              displayName: "面包",
              stackCount: 15,
              baseValue: 25,
              tags: ["food"],
              isCurrency: false,
            },
            availableCount: 15,
            tradeLocked: false,
          },
          {
            item: {
              itemId: "water_bottle",
              displayName: "水瓶",
              stackCount: 20,
              baseValue: 15,
              tags: ["water"],
              isCurrency: false,
            },
            availableCount: 20,
            tradeLocked: false,
          },
          {
            item: {
              itemId: "currency_base",
              displayName: "创世结晶",
              stackCount: 60,
              baseValue: 1,
              tags: ["currency"],
              isCurrency: true,
            },
            availableCount: 60,
            tradeLocked: false,
          },
        ];

        const context = createTradeContext(
          "Shop",
          "demo_location",
          merchant,
          playerInventory,
          merchantInventory,
          valueCalculator,
          feelingCalculator
        );

        const baseRenderer = createDemoRenderer();
        /** @type {import("./js/trade_canvas_ui.js").TradeUIState | null} */
        let stateRef = null;

        const renderer = bindDemoRendererWithState(
          baseRenderer,
          () => /** @type {import("./js/trade_canvas_ui.js").TradeUIState} */ (
            stateRef
          )
        );

        stateRef = createTradeUIState(canvas, context, {
          renderer,
          tryCommitTrade,
        });

        // 供手工自检
        window.__tradeState = stateRef;
        window.__tradeContext = context;

        window.addEventListener("resize", () => {
          resizeCanvas();
          refreshTradeUILayout(stateRef);
        });

        console.log("交易 UI Demo 已初始化。可在控制台查看 window.__tradeContext / window.__tradeState。");
      }

      window.addEventListener("DOMContentLoaded", initDemo);
    </script>
  </body>
  </html>
