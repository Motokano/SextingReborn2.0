      function renderTempBackpack() {
        var html = "";
        var used = 0;
        for (var i = 0; i < TEMP_BACKPACK_SIZE; i++) {
          var item = state.tempBackpack[i];
          var cls = "temp-bag-slot" + (state.selectedTempBackpackSlot === i ? " selected" : "");
          if (item) {
            used += 1;
            html += "<div class='" + cls + "' data-temp-slot='" + i + "'>" +
              "<div class='temp-bag-name'>" + item.name + "</div>" +
              "<div class='temp-bag-meta'>x" + item.count + "</div>" +
              "</div>";
          } else {
            html += "<div class='" + cls + "' data-temp-slot='" + i + "'>" +
              "<div class='temp-bag-empty'></div>" +
              "</div>";
          }
        }
        el.tempBackpackGrid.innerHTML = html;
        el.tempBackpackCount.textContent = used + " / " + TEMP_BACKPACK_SIZE;
      }

      function hasTempItem(itemId, count) {
        var need = count || 1;
        for (var i = 0; i < TEMP_BACKPACK_SIZE; i++) {
          var item = state.tempBackpack[i];
          if (item && item.id === itemId && item.count >= need) return true;
        }
        return false;
      }

      function takeTempItem(itemId, count) {
        var need = count || 1;
        for (var i = 0; i < TEMP_BACKPACK_SIZE; i++) {
          var item = state.tempBackpack[i];
          if (!item || item.id !== itemId || item.count < need) continue;
          item.count -= need;
          if (item.count <= 0) state.tempBackpack[i] = null;
          return true;
        }
        return false;
      }

      function addTempItem(itemId, name, count) {
        var add = count || 1;
        for (var i = 0; i < TEMP_BACKPACK_SIZE; i++) {
          var item = state.tempBackpack[i];
          if (item && item.id === itemId) {
            item.count += add;
            return true;
          }
        }
        for (var j = 0; j < TEMP_BACKPACK_SIZE; j++) {
          if (!state.tempBackpack[j]) {
            state.tempBackpack[j] = { id: itemId, name: name, count: add };
            return true;
          }
        }
        return false;
      }

      function takeTempSlotCount(slotIndex, count) {
        var need = count || 1;
        var item = state.tempBackpack[slotIndex];
        if (!item || item.count < need) return false;
        item.count -= need;
        if (item.count <= 0) state.tempBackpack[slotIndex] = null;
        return true;
      }

      function hasSoilAmendItemInBackpack() {
        for (var i = 0; i < TEMP_BACKPACK_SIZE; i++) {
          var it = state.tempBackpack[i];
          if (it && SOIL_AMEND_ITEMS[it.id]) return true;
        }
        return false;
      }

      /** 客土改良可执行：土地、未开垦、背包内有登记道�?*/
      function canSoilAmendAct(c) {
        return c.kind === "land" && !c.tilled && hasSoilAmendItemInBackpack();
      }

      function canOpenLandBuildMenu(c) {
        if (c.kind !== "land") return false;
        return canBuild(c) || canTill(c) || canRemoveTilled(c) || cellHasPlantableCropOption(c) || canHarvest(c)
          || canBuildCropStructure(c) || canRemoveCropStructure(c) || hasCropStructure(c);
      }

      function closeSoilAmendPicker() {
        state.soilAmendPicker = null;
        if (el.soilAmendModal) {
          el.soilAmendModal.hidden = true;
          el.soilAmendList.innerHTML = "";
        }
      }

      function openSoilAmendPicker(x, y) {
        var c0 = cell(state, x, y);
        if (!canSoilAmendAct(c0)) return;
        hideBuildMenu();
        closeVenturiAddPicker();
        state.soilAmendPicker = { x: x, y: y };
        var list = el.soilAmendList;
        list.innerHTML = "";
        var found = false;
        for (var i = 0; i < TEMP_BACKPACK_SIZE; i++) {
          var it = state.tempBackpack[i];
          if (!it) continue;
          var rec = SOIL_AMEND_ITEMS[it.id];
          if (!rec) continue;
          found = true;
          var btn = document.createElement("button");
          btn.type = "button";
          btn.className = "soil-amend-pick-btn";
          btn.dataset.slot = String(i);
          btn.textContent = it.name + " ×" + it.count;
          list.appendChild(btn);
        }
        if (!found) {
          list.innerHTML = "<div class='muted'>背包中没有可用的客土道具</div>";
        }
        el.soilAmendModal.hidden = false;
      }

      function startSoilAmendTask(x, y, itemId, itemName, soilId, soilType) {
        state.task = {
          type: "soil_amend",
          x: x,
          y: y,
          progress: 0,
          paused: false,
          soilId: soilId,
          soilType: soilType,
          refundItemId: itemId,
          refundItemName: itemName
        };
        closeSoilAmendPicker();
      }

      function buyShopItem(shopItem) {
        var seedRow = getSeedShopRowByItemId(shopItem.itemId);
        if (seedRow) {
          var tierReq = getSeedTierTradeUnlockRequired(seedRow.tier);
          var tradeVol = Number(state.shopTradeVolume) || 0;
          if (tradeVol < tierReq) {
            state.shopMessage = seedRow.name + " 属 " + (seedRow.tier || "?") + " 档种子，需累计交易额 "
              + tierReq + " 才可购买（当前 " + tradeVol + "）。";
            return false;
          }
        }
        if (state.money < shopItem.price) {
          state.shopMessage = "金钱不足。";
          return false;
        }
        if (!addTempItem(shopItem.itemId, shopItem.name, 1)) {
          state.shopMessage = "临时背包已满。";
          return false;
        }
        state.money -= shopItem.price;
        addShopTradeVolume(state, shopItem.price);
        state.shopMessage = "购买成功：" + shopItem.name + " x1（交易额 +" + shopItem.price + "）";
        return true;
      }

      function sellTempBackpackItem(slotIndex) {
        var item = state.tempBackpack[slotIndex];
        if (!item) return false;
        var price = ITEM_SELL_PRICES[item.id] || 0;
        if (price <= 0) {
          state.shopMessage = "该物品暂不可出售。";
          return false;
        }
        item.count -= 1;
        state.money += price;
        addShopTradeVolume(state, price);
        state.shopMessage = "出售成功：" + item.name + " x1，获得 " + price + " 金钱（交易额 +" + price + "）。";
        if (item.count <= 0) {
          state.tempBackpack[slotIndex] = null;
          hideItemMenu();
        }
        return true;
      }

      function render() {
        el.stamina.textContent = "体力: " + state.stamina.toFixed(1);
        el.mode.textContent = "模式: " + modeText(state.mode);
        el.task.textContent = taskText();
        el.moneyInfo.textContent = String(state.money);
        if (el.shopTradeVolume) {
          el.shopTradeVolume.textContent = String(state.shopTradeVolume || 0);
        }
        el.shopMessage.textContent = "";
        el.summary.textContent = SIZE + "x" + SIZE + " · 主干 " + state.trunkPath.length + " · 支流 " + state.branches.length + " · 水渠 " + Object.keys(state.channels).length;
        var poolLv = getPoolLevel(state);
        el.waterSummary.textContent = "池 L" + poolLv + " · 灌溉 " + round1(state.basePoolWater || BASE_POOL_WATER).toFixed(1)
          + " / 现 " + state.poolCurrent.toFixed(1)
          + (poolLv >= 3 ? (" · 蓄 " + round1((state.pool_reservoir && state.pool_reservoir.stored) || 0).toFixed(0)) : "");
        el.pause.textContent = state.paused ? "恢复" : "暂停";
        el.toggleTaskPause.textContent = state.task && state.task.paused ? "继续工程" : "暂停工程";
        el.toggleTaskPause.disabled = !state.task;

        var nodes = el.grid.children;
        for (var i = 0; i < nodes.length; i++) {
          var d = nodes[i];
          var x = Number(d.dataset.x);
          var y = Number(d.dataset.y);
          var c = cell(state, x, y);
          var cls = ["cell"];
          if (c.kind === "pool") cls.push("pool");
          else if (c.kind === "channel") {
            cls.push("channel");
            if (c.isTrunk) cls.push("trunk");
            else if (c.water > 0) cls.push("branch-water");
            else cls.push("branch-dry");
            if (c.algaeBloom && c.water > 0) cls.push("algae-bloom");
          } else if (isVenturiCell(c)) {
            cls.push("venturi-fertilizer");
            if (venturiLiquidIsActive(c.venturiLiquid)) cls.push("venturi-effect-active");
          } else if (isBuriedPotJarCell(c)) {
            cls.push("buried-pot-jar");
            if (facilityLiquidIsActive(c.jarLiquid)) cls.push("jar-liquid-active");
          } else if (isSuperFusionCell(c)) {
            cls.push("super-fusion");
          } else {
            cls.push("land");
            if (c.tilled) cls.push("tilled");
            if (hasCropStructure(c)) {
              cls.push("crop-structure", "crop-structure-" + c.cropStructure);
            }
          }
          if (c.crop) {
            cls.push(c.crop.settled
              ? (c.crop.result === "withered" || c.crop.result === "flooded" || c.crop.result === "trace_toxic"
                ? "crop-failed"
                : "crop-ready")
              : "crop-growing");
          }
          if (c.water > 0) cls.push("has-water");
          if (x === state.selected.x && y === state.selected.y) cls.push("selected");
          d.className = cls.join(" ");
          d.removeAttribute("title");
          if (state.task && state.task.x === x && state.task.y === y) {
            var taskPrefix = state.task.paused ? "暂停 " : "";
            d.innerHTML = "<div class='cell-task-progress'>" + taskPrefix + state.task.progress + "/" + TASK_TICKS + "</div>";
          } else {
            d.innerHTML = "";
          }
        }
        renderSelectedInfo();
        renderCropInfo();
        renderTempBackpack();
        renderBuildMenu();
        renderItemMenu();
        renderSeedShop();
        renderPoolUpgradePanel();
      }

      function canRemove(c) { return c.kind === "channel"; }
      function canUpgrade(c) { return c.kind === "channel"; }
      function canDowngrade(c) { return c.kind === "channel" && c.capacity > DEFAULT_CHANNEL_CAPACITY; }

      function canBuild(c) { return c.kind === "land" && !c.crop && !hasCropStructure(c); }
      function canTill(c) { return c.kind === "land" && !c.tilled && !c.crop; }
      function canRemoveTilled(c) { return c.kind === "land" && c.tilled && !c.crop && !hasCropStructure(c); }
      function canPlantCrop(c, def) {
        return c.kind === "land" && c.tilled && !c.crop && def &&
          hasTempItem(def.seedItemId, 1) && plotHasRequiredCropStructure(c, def);
      }

      function cellHasPlantableCropOption(c) {
        var defs = listPlantableCropDefsForCell(c);
        for (var i = 0; i < defs.length; i++) {
          if (canPlantCrop(c, defs[i])) return true;
        }
        return false;
      }
      function canHarvest(c) { return c.kind === "land" && c.crop && c.crop.settled; }

      function plantCrop(c, def) {
        if (!canPlantCrop(c, def)) {
          if (def && cropRequiredStructureId(def) && !plotHasRequiredCropStructure(c, def)) {
            state.shopMessage = "无法种植「" + def.name + "」：须先在耕地上建造「" +
              cropStructureDisplayName(cropRequiredStructureId(def)) + "」。";
          }
          return false;
        }
        if (!takeTempItem(def.seedItemId, 1)) return false;
        var hMax = def.healthMax != null ? Number(def.healthMax) : DEFAULT_CROP_HEALTH_MAX;
        if (!(hMax > 0)) hMax = DEFAULT_CROP_HEALTH_MAX;
        var hCur = def.healthCurrent != null ? Number(def.healthCurrent) : hMax;
        if (!(hCur >= 0)) hCur = hMax;
        if (hCur > hMax) hCur = hMax;
        updateSameCropStreakOnPlant(c, def);
        var growTicks = resolveCropGrowthTicks(c, def, state);
        c.crop = {
          cropId: def.cropId,
          name: def.name,
          remainingTicks: growTicks,
          totalTicks: growTicks,
          waterAbsorbed: 0,
          traceAbsorbed: 0,
          fertilizerAbsorbed: 0,
          healthMax: hMax,
          healthCurrent: hCur,
          settled: false,
          result: "growing",
          resultLabel: "生长中",
          harvestItemId: def.productItemId,
          harvestItemName: def.productName,
          harvestCount: 0
        };
        initCropSoilFieldsOnPlant(c, c.crop, def, state);
        syncPlotSeaweedRequests(state, c.x, c.y);
        syncPlotFertilizerRequests(state, c.x, c.y);
        return true;
      }

      function settleCrop(c) {
        var crop = c.crop;
        if (!crop || crop.settled) return;
        var def = CROP_DEFS[crop.cropId];
        var water = crop.waterAbsorbed;
        crop.remainingTicks = 0;
        crop.settled = true;
        if (water < def.minWater) {
          crop.result = "withered";
          crop.resultLabel = "水分不足枯萎";
          crop.harvestCount = 0;
        } else if (water > def.maxWater) {
          crop.result = "flooded";
          crop.resultLabel = "水分过多淹死";
          crop.harvestCount = 0;
        } else if (
          cropTraceSensitivity(def) === "severe" &&
          def.trace_fail_harvest_at != null &&
          round1(crop.traceAbsorbed || 0) >= Number(def.trace_fail_harvest_at)
        ) {
          crop.result = "trace_toxic";
          crop.resultLabel = "微量过剩·盐害灼伤落果";
          crop.harvestCount = 0;
        } else {
          var yieldResult = computeGrowthYield(def, c, crop);
          crop.result = "mature";
          crop.resultLabel = "成熟";
          crop.harvestCount = yieldResult.harvestCount;
          crop.growthScorePositive = yieldResult.growthScorePositive;
          crop.growthScoreNegative = yieldResult.growthScoreNegative;
          crop.yieldMultiplier = yieldResult.yieldMultiplier;
        }
      }

      function harvestCrop(c) {
        if (!canHarvest(c)) return false;
        var crop = c.crop;
        if (crop.harvestCount > 0 && !addTempItem(crop.harvestItemId, crop.harvestItemName, crop.harvestCount)) return false;
        c.previousCropId = crop.cropId;
        c.crop = null;
        syncPlotSeaweedRequests(state, c.x, c.y);
        syncPlotFertilizerRequests(state, c.x, c.y);
        return true;
      }

      function startVenturiBuildTask(x, y) {
        if (state.money < VENTURI_BUILD_COST_MONEY) {
          state.shopMessage = "金钱不足（建造文丘里施肥器需 " + VENTURI_BUILD_COST_MONEY + "）。";
          return false;
        }
        state.money -= VENTURI_BUILD_COST_MONEY;
        state.task = {
          type: "build_venturi",
          x: x,
          y: y,
          progress: 0,
          paused: false,
          prepaidMoney: VENTURI_BUILD_COST_MONEY
        };
        hideBuildMenu();
        return true;
      }

      function startBuriedPotJarBuildTask(x, y) {
        if (state.money < BURIED_POT_JAR_BUILD_COST_MONEY) {
          state.shopMessage = "金钱不足（建造埋地陶瓮需 " + BURIED_POT_JAR_BUILD_COST_MONEY + "）。";
          return false;
        }
        state.money -= BURIED_POT_JAR_BUILD_COST_MONEY;
        state.task = {
          type: "build_buried_pot_jar",
          x: x,
          y: y,
          progress: 0,
          paused: false,
          prepaidMoney: BURIED_POT_JAR_BUILD_COST_MONEY
        };
        hideBuildMenu();
        return true;
      }

      function startSuperFusionBuildTask(x, y) {
        if (state.money < SUPER_FUSION_BUILD_COST_MONEY) {
          state.shopMessage = "金钱不足（建造超融合需 " + SUPER_FUSION_BUILD_COST_MONEY + "）。";
          return false;
        }
        state.money -= SUPER_FUSION_BUILD_COST_MONEY;
        state.task = {
          type: "build_super_fusion",
          x: x,
          y: y,
          progress: 0,
          paused: false,
          prepaidMoney: SUPER_FUSION_BUILD_COST_MONEY
        };
        hideBuildMenu();
        return true;
      }

      function startCropStructureBuildTask(x, y, structureId) {
        if (!cropStructureDef(structureId)) {
          state.shopMessage = "未知耕地建造物类型。";
          return false;
        }
        var c0 = cell(state, x, y);
        if (!canBuildCropStructure(c0)) {
          state.shopMessage = "仅可在已开垦且无作物、无其它建造物的耕地上建造。";
          return false;
        }
        if (state.money < CROP_STRUCTURE_BUILD_COST_MONEY) {
          state.shopMessage = "金钱不足（建造「" + cropStructureDisplayName(structureId) + "」需 " + CROP_STRUCTURE_BUILD_COST_MONEY + "）。";
          return false;
        }
        state.money -= CROP_STRUCTURE_BUILD_COST_MONEY;
        state.task = {
          type: "build_crop_structure",
          structureId: structureId,
          x: x,
          y: y,
          progress: 0,
          paused: false,
          prepaidMoney: CROP_STRUCTURE_BUILD_COST_MONEY
        };
        hideBuildMenu();
        return true;
      }

      function startTask(type, x, y) {
        state.task = { type: type, x: x, y: y, progress: 0, paused: false };
        hideBuildMenu();
      }

      function startPaidTask(type, x, y, cost) {
        if (state.money < cost) {
          state.shopMessage = "金钱不足，无法开始工程。";
          return false;
        }
        state.money -= cost;
        startTask(type, x, y);
        return true;
      }

      function applyTask(task) {
        var c = cell(state, task.x, task.y);
        if (task.type === "build") {
          c.kind = "channel";
          c.capacity = DEFAULT_CHANNEL_CAPACITY;
          c.seaweedConcentration = 0;
          c.algaeBloom = false;
          c.tilled = false;
          c.cropStructure = null;
          c.crop = null;
        } else if (task.type === "remove") {
          c.kind = "land";
          c.capacity = 0;
          c.water = 0;
          c.tilled = false;
          c.crop = null;
        } else if (task.type === "upgrade") {
          c.capacity += CHANNEL_CAPACITY_STEP;
        } else if (task.type === "downgrade") {
          c.capacity = Math.max(DEFAULT_CHANNEL_CAPACITY, c.capacity - CHANNEL_CAPACITY_STEP);
        } else if (task.type === "till") {
          c.tilled = true;
        } else if (task.type === "remove_tilled") {
          c.tilled = false;
        } else if (task.type === "soil_amend") {
          if (c.kind === "land") {
            c.soilId = task.soilId || c.soilId;
            c.soilType = task.soilType;
          }
        } else if (task.type === "build_venturi") {
          c.kind = "venturi_fertilizer";
          c.tilled = false;
          c.crop = null;
          c.capacity = 0;
          c.water = 0;
          c.seaweedConcentration = 0;
          c.algaeBloom = false;
          c.venturiLiquid = null;
          c.venturiLevel = 1;
          c.seaweedSetConcentration = VENTURI_DEFAULT_SET_CONC;
          ensureVenturiCellFields(c);
        } else if (task.type === "remove_venturi") {
          var liqR = c.venturiLiquid;
          if (liqR && liqR.units) {
            var nmR = liqR.name || (VENTURI_INJECTABLE_LIQUIDS[liqR.itemId] && VENTURI_INJECTABLE_LIQUIDS[liqR.itemId].name) || liqR.itemId;
            addTempItem(liqR.itemId, nmR, liqR.units);
          }
          c.venturiLiquid = null;
          c.kind = "land";
          c.capacity = 0;
          c.water = 0;
          c.tilled = false;
          c.crop = null;
        } else if (task.type === "build_buried_pot_jar") {
          c.kind = "buried_pot_jar";
          c.tilled = false;
          c.crop = null;
          c.capacity = 0;
          c.water = 0;
          c.seaweedConcentration = 0;
          c.algaeBloom = false;
          c.jarLiquid = null;
          syncFertilizerRequestsNearBuriedJar(state, task.x, task.y);
        } else if (task.type === "remove_buried_pot_jar") {
          var liqJar = c.jarLiquid;
          if (liqJar && liqJar.units) {
            var nmJar = liqJar.name || (injectableMeta(liqJar.itemId) && injectableMeta(liqJar.itemId).name) || liqJar.itemId;
            addTempItem(liqJar.itemId, nmJar, liqJar.units);
          }
          c.jarLiquid = null;
          c.kind = "land";
          c.capacity = 0;
          c.water = 0;
          c.tilled = false;
          c.crop = null;
          syncFertilizerRequestsNearBuriedJar(state, task.x, task.y);
        } else if (task.type === "build_super_fusion") {
          c.kind = "super_fusion";
          c.tilled = false;
          c.crop = null;
          c.cropStructure = null;
          c.capacity = 0;
          c.water = 0;
          c.seaweedConcentration = 0;
          c.algaeBloom = false;
          syncAllCropGrowthTicksForFusionChange(state);
        } else if (task.type === "remove_super_fusion") {
          c.kind = "land";
          c.capacity = 0;
          c.water = 0;
          c.tilled = false;
          c.crop = null;
          syncAllCropGrowthTicksForFusionChange(state);
        } else if (task.type === "build_crop_structure") {
          if (c.kind === "land" && c.tilled) c.cropStructure = task.structureId;
        } else if (task.type === "remove_crop_structure") {
          c.cropStructure = null;
        }
      }

      function onCellClick(x, y, e) {
        state.selected = { x: x, y: y };
        var c = cell(state, x, y);
        if (state.task) { hideBuildMenu(); render(); return; }

        if (canBuild(c) || canRemove(c) || canHarvest(c) || canOpenLandBuildMenu(c) || isFacilityCell(c)) openTileMenu(x, y, e);
        else {
          hideBuildMenu();
          if (state.mode === "upgrade" && canUpgrade(c)) startTask("upgrade", x, y);
        }
        render();
      }

      function tickOnce() {
        state.tick += 1;
        if (state.task) {
          if (state.task.paused) {
            state.stamina = round1(Math.min(MAX_STAMINA, state.stamina + RECOVER_STAMINA_PER_TICK));
          } else if (state.stamina >= TASK_STAMINA_PER_TICK) {
            state.stamina = round1(Math.max(0, state.stamina - TASK_STAMINA_PER_TICK));
            state.task.progress += 1;
            if (state.task.progress >= TASK_TICKS) {
              applyTask(state.task);
              state.task = null;
              recomputeIrrigationNetwork(state);
            }
          } else {
            // 体力不足时工程暂停，但角色仍会恢复体力，避免卡死在施工状态。?
            state.stamina = round1(Math.min(MAX_STAMINA, state.stamina + RECOVER_STAMINA_PER_TICK));
          }
        } else {
          state.stamina = round1(Math.min(MAX_STAMINA, state.stamina + RECOVER_STAMINA_PER_TICK));
        }
        runAgricultureMapTick(state);
        render();
      }

      function bind() {
        el.gridWrap.addEventListener("wheel", onViewportWheel, { passive: false });
        el.gridWrap.addEventListener("pointerdown", onViewportPointerDown);
        document.addEventListener("pointermove", onDocumentPointerMove, { passive: false, capture: true });
        document.addEventListener("pointerup", onDocumentPointerUp, { capture: true });
        document.addEventListener("pointercancel", onDocumentPointerUp, { capture: true });
        el.gridWrap.addEventListener("auxclick", function (e) {
          if (e.button === 1) e.preventDefault();
        });

        document.addEventListener("keydown", function (e) {
          if (e.code !== "Space") return;
          if (e.repeat) return;
          var tag = (e.target && e.target.tagName) || "";
          if (tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT" || e.target.isContentEditable) return;
          e.preventDefault();
          spaceHeld = true;
          el.gridWrap.classList.add("space-pan");
        });
        document.addEventListener("keyup", function (e) {
          if (e.code !== "Space") return;
          spaceHeld = false;
          el.gridWrap.classList.remove("space-pan");
        });
        window.addEventListener("blur", function () {
          spaceHeld = false;
          el.gridWrap.classList.remove("space-pan");
          leftDragCandidate = null;
          if (pan.active) {
            pan.active = false;
            pan.pointerId = null;
            pan.moved = false;
            el.gridWrap.classList.remove("panning");
          }
        });

        el.grid.addEventListener("click", function (e) {
          if (suppressNextClick) {
            e.preventDefault();
            e.stopPropagation();
            suppressNextClick = false;
            return;
          }
          var t = e.target && e.target.closest ? e.target.closest(".cell") : e.target;
          if (!t || !t.dataset || t.dataset.x == null) return;
          onCellClick(Number(t.dataset.x), Number(t.dataset.y), e);
        });
        el.tillLand.addEventListener("click", function (e) {
          e.stopPropagation();
          if (!state.buildMenu || state.task) return;
          var c = cell(state, state.buildMenu.x, state.buildMenu.y);
          if (canTill(c)) startTask("till", state.buildMenu.x, state.buildMenu.y);
          render();
        });
        el.removeTilledLand.addEventListener("click", function (e) {
          e.stopPropagation();
          if (!state.buildMenu || state.task) return;
          var c = cell(state, state.buildMenu.x, state.buildMenu.y);
          if (canRemoveTilled(c)) startTask("remove_tilled", state.buildMenu.x, state.buildMenu.y);
          render();
        });
        if (el.cropStructuresPanel) {
          el.cropStructuresPanel.addEventListener("click", function (e) {
            e.stopPropagation();
            if (!state.buildMenu || state.task) return;
            var b = e.target && e.target.closest ? e.target.closest(".crop-struct-btn") : null;
            if (!b || b.disabled) return;
            var sid = b.getAttribute("data-crop-structure");
            if (!sid) return;
            var cSt = cell(state, state.buildMenu.x, state.buildMenu.y);
            if (!canBuildCropStructure(cSt)) return;
            if (startCropStructureBuildTask(state.buildMenu.x, state.buildMenu.y, sid)) render();
          });
        }
        if (el.removeCropStructure) {
          el.removeCropStructure.addEventListener("click", function (e) {
            e.stopPropagation();
            if (!state.buildMenu || state.task) return;
            var cRm = cell(state, state.buildMenu.x, state.buildMenu.y);
            if (!canRemoveCropStructure(cRm)) return;
            state.task = {
              type: "remove_crop_structure",
              structureId: cRm.cropStructure,
              x: state.buildMenu.x,
              y: state.buildMenu.y,
              progress: 0,
              paused: false
            };
            hideBuildMenu();
            render();
          });
        }
        if (el.plantCropList) {
          el.plantCropList.addEventListener("click", function (e) {
            var b = e.target && e.target.closest ? e.target.closest(".plant-crop-btn") : null;
            if (!b || !b.dataset.cropId) return;
            e.stopPropagation();
            if (!state.buildMenu || state.task) return;
            var c = cell(state, state.buildMenu.x, state.buildMenu.y);
            var def = CROP_DEFS[b.dataset.cropId];
            if (canPlantCrop(c, def)) plantCrop(c, def);
            hideBuildMenu();
            render();
          });
        }
        el.soilAmend.addEventListener("click", function (e) {
          e.stopPropagation();
          if (!state.buildMenu || state.task) return;
          var c = cell(state, state.buildMenu.x, state.buildMenu.y);
          if (!canSoilAmendAct(c)) return;
          openSoilAmendPicker(state.buildMenu.x, state.buildMenu.y);
          render();
        });
        el.soilAmendList.addEventListener("click", function (e) {
          var b = e.target && e.target.closest ? e.target.closest(".soil-amend-pick-btn") : null;
          if (!b || b.dataset.slot == null) return;
          if (state.task) return;
          var slot = Number(b.dataset.slot);
          var it = state.tempBackpack[slot];
          if (!it) return;
          var rec = SOIL_AMEND_ITEMS[it.id];
          if (!rec) return;
          var pick = state.soilAmendPicker;
          if (!pick) return;
          var cellAt = cell(state, pick.x, pick.y);
          if (!canSoilAmendAct(cellAt)) return;
          var itemId = it.id;
          var itemName = it.name;
          if (!takeTempSlotCount(slot, 1)) return;
          startSoilAmendTask(pick.x, pick.y, itemId, itemName, rec.soilId, rec.soilType);
          render();
        });
        el.soilAmendCancel.addEventListener("click", function (e) {
          e.stopPropagation();
          closeSoilAmendPicker();
          render();
        });
        el.soilAmendModal.addEventListener("click", function (e) {
          if (e.target === el.soilAmendModal) {
            closeSoilAmendPicker();
            render();
          }
        });
        el.harvestCrop.addEventListener("click", function (e) {
          e.stopPropagation();
          if (!state.buildMenu || state.task) return;
          var c = cell(state, state.buildMenu.x, state.buildMenu.y);
          if (canHarvest(c)) harvestCrop(c);
          hideBuildMenu();
          render();
        });
        el.buildChannel.addEventListener("click", function (e) {
          e.stopPropagation();
          if (!state.buildMenu || state.task) return;
          var c = cell(state, state.buildMenu.x, state.buildMenu.y);
          if (canBuild(c)) startTask("build", state.buildMenu.x, state.buildMenu.y);
          render();
        });
        el.upgradeChannel.addEventListener("click", function (e) {
          e.stopPropagation();
          if (!state.buildMenu || state.task) return;
          var c = cell(state, state.buildMenu.x, state.buildMenu.y);
          if (canUpgrade(c)) startPaidTask("upgrade", state.buildMenu.x, state.buildMenu.y, CHANNEL_CAPACITY_CHANGE_COST);
          render();
        });
        el.downgradeChannel.addEventListener("click", function (e) {
          e.stopPropagation();
          if (!state.buildMenu || state.task) return;
          var c = cell(state, state.buildMenu.x, state.buildMenu.y);
          if (canDowngrade(c)) startPaidTask("downgrade", state.buildMenu.x, state.buildMenu.y, CHANNEL_CAPACITY_CHANGE_COST);
          render();
        });
        el.removeChannel.addEventListener("click", function (e) {
          e.stopPropagation();
          if (!state.buildMenu || state.task) return;
          var c = cell(state, state.buildMenu.x, state.buildMenu.y);
          if (canRemove(c)) startTask("remove", state.buildMenu.x, state.buildMenu.y);
          render();
        });
        el.buildVenturi.addEventListener("click", function (e) {
          e.stopPropagation();
          if (!state.buildMenu || state.task) return;
          var c = cell(state, state.buildMenu.x, state.buildMenu.y);
          if (canBuild(c)) startVenturiBuildTask(state.buildMenu.x, state.buildMenu.y);
          render();
        });
        el.buildBuriedPotJar.addEventListener("click", function (e) {
          e.stopPropagation();
          if (!state.buildMenu || state.task) return;
          var c = cell(state, state.buildMenu.x, state.buildMenu.y);
          if (canBuild(c)) startBuriedPotJarBuildTask(state.buildMenu.x, state.buildMenu.y);
          render();
        });
        if (el.buildSuperFusion) {
          el.buildSuperFusion.addEventListener("click", function (e) {
            e.stopPropagation();
            if (!state.buildMenu || state.task) return;
            var cSf = cell(state, state.buildMenu.x, state.buildMenu.y);
            if (canBuild(cSf)) startSuperFusionBuildTask(state.buildMenu.x, state.buildMenu.y);
            render();
          });
        }
        el.addVenturiLiquid.addEventListener("click", function (e) {
          e.stopPropagation();
          if (!state.buildMenu || state.task) return;
          var c = cell(state, state.buildMenu.x, state.buildMenu.y);
          if (isVenturiCell(c)) openVenturiAddPicker(state.buildMenu.x, state.buildMenu.y);
          render();
        });
        if (el.addBuriedJarLiquid) {
          el.addBuriedJarLiquid.addEventListener("click", function (e) {
            e.stopPropagation();
            if (!state.buildMenu || state.task) return;
            var c = cell(state, state.buildMenu.x, state.buildMenu.y);
            if (isBuriedPotJarCell(c)) openBuriedJarAddPicker(state.buildMenu.x, state.buildMenu.y);
            render();
          });
        }
        el.removeVenturi.addEventListener("click", function (e) {
          e.stopPropagation();
          if (!state.buildMenu || state.task) return;
          var c = cell(state, state.buildMenu.x, state.buildMenu.y);
          if (canRemoveVenturi(c)) startTask("remove_venturi", state.buildMenu.x, state.buildMenu.y);
          render();
        });
        el.removeBuriedPotJar.addEventListener("click", function (e) {
          e.stopPropagation();
          if (!state.buildMenu || state.task) return;
          var cJar = cell(state, state.buildMenu.x, state.buildMenu.y);
          if (canRemoveBuriedPotJar(cJar)) startTask("remove_buried_pot_jar", state.buildMenu.x, state.buildMenu.y);
          render();
        });
        if (el.removeSuperFusion) {
          el.removeSuperFusion.addEventListener("click", function (e) {
            e.stopPropagation();
            if (!state.buildMenu || state.task) return;
            var cSfRm = cell(state, state.buildMenu.x, state.buildMenu.y);
            if (isSuperFusionCell(cSfRm)) startTask("remove_super_fusion", state.buildMenu.x, state.buildMenu.y);
            render();
          });
        }
        if (el.venturiUpgrade) {
          el.venturiUpgrade.addEventListener("click", function (e) {
            e.stopPropagation();
            if (!state.buildMenu || state.task) return;
            if (tryUpgradeVenturiAt(state.buildMenu.x, state.buildMenu.y)) render();
          });
        }
        if (el.venturiConcMinus) {
          el.venturiConcMinus.addEventListener("click", function (e) {
            e.stopPropagation();
            if (!state.buildMenu || state.task) return;
            if (stepSeaweedSetConcentrationAt(state.buildMenu.x, state.buildMenu.y, -1)) render();
          });
        }
        if (el.venturiConcPlus) {
          el.venturiConcPlus.addEventListener("click", function (e) {
            e.stopPropagation();
            if (!state.buildMenu || state.task) return;
            if (stepSeaweedSetConcentrationAt(state.buildMenu.x, state.buildMenu.y, 1)) render();
          });
        }
        if (el.venturiConcRange) {
          el.venturiConcRange.addEventListener("input", function (e) {
            e.stopPropagation();
            if (!state.buildMenu || state.task) return;
            if (setSeaweedSetConcentrationAt(state.buildMenu.x, state.buildMenu.y, Number(el.venturiConcRange.value))) render();
          });
        }
        el.facilityLiquidList.addEventListener("click", function (e) {
          var b = e.target && e.target.closest ? e.target.closest(".facility-liquid-pick-btn") : null;
          if (!b || b.disabled || b.dataset.slot == null) return;
          if (state.task) return;
          var slot = Number(b.dataset.slot);
          var pick = state.facilityLiquidPicker;
          if (!pick) return;
          tryInjectFacilityLiquid(pick.x, pick.y, pick.facilityKind, slot);
          render();
        });
        el.facilityLiquidCancel.addEventListener("click", function (e) {
          e.stopPropagation();
          closeFacilityLiquidPicker();
          render();
        });
        el.facilityLiquidModal.addEventListener("click", function (e) {
          if (e.target === el.facilityLiquidModal) {
            closeFacilityLiquidPicker();
            render();
          }
        });
        el.tempBackpackGrid.addEventListener("click", function (e) {
          var t = e.target && e.target.closest ? e.target.closest(".temp-bag-slot") : e.target;
          if (!t || !t.dataset || t.dataset.tempSlot == null) return;
          state.selectedTempBackpackSlot = Number(t.dataset.tempSlot);
          openItemMenu(state.selectedTempBackpackSlot, e);
          render();
        });
        el.sellItem.addEventListener("click", function () {
          if (!state.itemMenu) return;
          sellTempBackpackItem(state.itemMenu.slotIndex);
          render();
        });
        if (el.shopSeedList) {
          el.shopSeedList.addEventListener("click", function (e) {
            var b = e.target && e.target.closest ? e.target.closest(".btn-buy-seed") : null;
            if (!b || b.disabled) return;
            buyShopItem({
              itemId: b.getAttribute("data-item-id"),
              name: b.getAttribute("data-item-name"),
              price: Number(b.getAttribute("data-price")) || 0
            });
            render();
          });
        }
        renderShopSoilList();
        if (el.shopSoilList) {
          el.shopSoilList.addEventListener("click", function (e) {
            var b = e.target && e.target.closest ? e.target.closest(".btn-buy-soil") : null;
            if (!b) return;
            buyShopItem({
              itemId: b.getAttribute("data-item-id"),
              name: b.getAttribute("data-item-name"),
              price: Number(b.getAttribute("data-price")) || 0
            });
            render();
          });
        }
        el.buyLiquidFertilizerN.addEventListener("click", function () {
          buyShopItem(SHOP_ITEMS.liquidFertilizerN);
          render();
        });
        el.buyLiquidSeaweedExtract.addEventListener("click", function () {
          buyShopItem(SHOP_ITEMS.liquidSeaweedExtract);
          render();
        });
        var modeBtns = document.querySelectorAll(".mode-btn");
        for (var i = 0; i < modeBtns.length; i++) {
          modeBtns[i].addEventListener("click", function () {
            var btns = document.querySelectorAll(".mode-btn");
            for (var j = 0; j < btns.length; j++) btns[j].classList.remove("active");
            this.classList.add("active");
            state.mode = this.dataset.mode;
            hideBuildMenu();
            hideItemMenu();
            closeSoilAmendPicker();
            closeVenturiAddPicker();
            render();
          });
        }
        el.pause.addEventListener("click", function () {
          state.paused = !state.paused;
          render();
        });
        if (el.tickBtn) el.tickBtn.addEventListener("click", tickOnce);
        if (el.openSeaweedGuide) {
          el.openSeaweedGuide.addEventListener("click", openSeaweedGuideModal);
        }
        if (el.seaweedGuideClose) {
          el.seaweedGuideClose.addEventListener("click", closeSeaweedGuideModal);
        }
        if (el.seaweedGuideModal) {
          el.seaweedGuideModal.addEventListener("click", function (ev) {
            if (ev.target === el.seaweedGuideModal) closeSeaweedGuideModal();
          });
        }
        if (el.runSeaweedE2e) {
          el.runSeaweedE2e.addEventListener("click", function () {
            state.paused = true;
            var result = runSeaweedExtractE2EAcceptance();
            if (el.pillE2e) {
              el.pillE2e.textContent = result.ok ? "验收: 通过" : "验收: 失败";
            }
            state.shopMessage = result.ok
              ? "§9 海藻精端到端验收通过（" + result.steps.length + " 步）。"
              : "§9 验收失败：" + (result.errors[0] || "未知");
            if (!result.ok) console.error("[AgricultureIrrigationDemo] §9 E2E failed", result);
            else console.info("[AgricultureIrrigationDemo] §9 E2E passed", result.snapshot);
            render();
          });
        }
        if (el.reset) {
          el.reset.addEventListener("click", function () {
            state = createInitialState();
            hideItemMenu();
            closeSoilAmendPicker();
            closeVenturiAddPicker();
            recomputeIrrigationNetwork(state);
            resetViewport();
            render();
          });
        }
        if (el.poolUpgradeBtn) {
          el.poolUpgradeBtn.addEventListener("click", function () {
            tryUpgradePool();
            recomputeIrrigationNetwork(state);
            render();
          });
        }
        if (el.poolTheftEnabled) {
          el.poolTheftEnabled.addEventListener("change", function () {
            syncPoolTheftFromUi();
            render();
          });
        }
        if (el.poolTheftVictim) {
          el.poolTheftVictim.addEventListener("change", function () {
            syncPoolTheftFromUi();
            render();
          });
        }
        if (el.poolTheftGain) {
          el.poolTheftGain.addEventListener("change", function () {
            syncPoolTheftFromUi();
            render();
          });
        }
        if (el.toggleTaskPause) {
          el.toggleTaskPause.addEventListener("click", function () {
            if (!state.task) return;
            state.task.paused = !state.task.paused;
            render();
          });
        }
        if (el.cancelTask) {
          el.cancelTask.addEventListener("click", function () {
            if (state.task && state.task.prepaidMoney) {
              state.money += state.task.prepaidMoney;
            }
            if (state.task && state.task.type === "soil_amend" && state.task.refundItemId) {
              addTempItem(state.task.refundItemId, state.task.refundItemName, 1);
            }
            state.task = null;
            hideBuildMenu();
            render();
          });
        }
      }

      buildGridDom();
      bind();
      loadSeedShopCatalog(function () {
        loadCropDefs(function () {
          loadSoilDefs(function () {
            render();
            resetViewport();
          });
        });
      });
      setInterval(function () {
        if (!state.paused) tickOnce();
      }, TICK_MS);
    })();
  </script>
</body>
</html>
