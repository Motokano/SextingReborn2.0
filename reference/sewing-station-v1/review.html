<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>缝纫台棋子 · 外观评审</title><style>body{margin:0;padding:24px;background:#232825;color:#e5e4d9;font:14px/1.7 'Microsoft YaHei',sans-serif}h1{font-size:22px;color:#c5b083}section{display:flex;gap:24px;align-items:end;flex-wrap:wrap}.large{height:400px;max-width:90vw;object-fit:contain}canvas{border:1px solid #8f998044;background:#333e32;border-radius:6px}small{color:#a3aaa0}</style><h1>缝纫台 · 设施棋子首版</h1><p>与制药台共用手绘风格、三分之四视角和深灰椭圆底座。基础形象包含缝纫机、人台、皮尺及布料。</p><section><img class="large" src="sewing.png" alt="缝纫台原图"><div><canvas id="review" width="480" height="180"></canvas><p>144px 格宽下：制药台 58px / 缝纫台 64px 可见宽度</p><small>外观尺寸比较；此页不接入正式游戏，不代表运行时阴影或功能验收。</small></div></section><script>
const canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d');
async function draw(src,x,width,label){const im=new Image();im.src=src;await im.decode();const c=document.createElement('canvas');c.width=im.width;c.height=im.height;const p=c.getContext('2d');p.drawImage(im,0,0);const d=p.getImageData(0,0,c.width,c.height).data;let l=c.width,t=c.height,r=0,b=0;for(let y=0;y<c.height;y++)for(let x=0;x<c.width;x++)if(d[(y*c.width+x)*4+3]>=16){l=Math.min(l,x);t=Math.min(t,y);r=Math.max(r,x);b=Math.max(b,y)}const w=r-l+1,h=b-t+1;ctx.strokeStyle='#77886a';ctx.beginPath();ctx.moveTo(x,89);ctx.lineTo(x+72,125);ctx.lineTo(x,161);ctx.lineTo(x-72,125);ctx.closePath();ctx.stroke();ctx.drawImage(im,l,t,w,h,x-width/2,133-h*width/w,width,h*width/w);ctx.fillStyle='#e5e4d9';ctx.font='12px Microsoft YaHei';ctx.textAlign='center';ctx.fillText(label,x,25)}
draw('../../assets/map/isometric/interactive-devices-v1/pharmacy.png',130,58,'制药台 · 现有素材');draw('sewing.png',350,64,'缝纫台 · 候选素材');
</script></html>
