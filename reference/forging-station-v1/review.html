<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>铸造台棋子</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#202925;color:#e4dfcf;font:14px/1.6 'Microsoft YaHei',sans-serif}main{max-width:1180px;margin:0 auto;padding:28px}header{display:flex;align-items:center;gap:18px;border-bottom:1px solid #5b665e;padding-bottom:14px}h1{font-size:24px;font-weight:500;margin:0}header span,small{color:#a9b6a9}section{display:flex;align-items:center;gap:30px;flex-wrap:wrap;margin-top:24px}.original{display:block;width:min(100%,520px);height:auto}.size-panel{max-width:100%;overflow:auto}canvas{display:block;width:540px;height:244px;background:#29362e;border-radius:8px}p{margin:12px 0 4px}a{color:#d6bd88}footer{margin-top:24px;border-top:1px solid #46534a;padding-top:16px}footer a{margin-right:20px}
</style>
<main>
<header><h1>铸造台</h1><span>首版外观</span></header>
<section>
<img class="original" src="forging.png" alt="铁砧、小锻炉、锤钳和淬火桶，共用深灰椭圆底座">
<div class="size-panel"><canvas id="scale" width="1080" height="488" aria-label="144像素格宽下，制药台、铸造台与缝纫台的大小对照"></canvas><p>144px 格宽 · 等比显示</p><small>尺寸对照，尚未接入地图阴影与交互。</small></div>
</section>
<footer><a href="forging.png">透明原图</a><a href="README.md">设计记录</a></footer>
</main>
<script>
const canvas=document.querySelector('#scale'),ctx=canvas.getContext('2d');ctx.scale(2,2);
const samples=[
 {src:'../../assets/map/isometric/interactive-devices-v1/pharmacy.png',crop:[223,80,863,1046],anchor:[659.5,1125],width:58,x:90,label:'制药台 · 58px'},
 {src:'forging.png',crop:[166,81,970,1079],anchor:[650,1159],width:68,x:270,label:'铸造台 · 68px'},
 {src:'../../assets/map/isometric/interactive-devices-v1/sewing.png',crop:[212,95,877,1033],anchor:[661,1127],width:64,x:450,label:'缝纫台 · 64px'}
];
Promise.all(samples.map(async s=>{const im=new Image();im.src=s.src;await im.decode();return {...s,im};})).then(loaded=>{
 for(const s of loaded){
  const y=143;ctx.fillStyle='#354637';ctx.strokeStyle='#60755e';ctx.lineWidth=1;
  ctx.beginPath();ctx.moveTo(s.x,y-36);ctx.lineTo(s.x+72,y);ctx.lineTo(s.x,y+36);ctx.lineTo(s.x-72,y);ctx.closePath();ctx.fill();ctx.stroke();
  const [l,t,w,h]=s.crop,k=s.width/w;ctx.drawImage(s.im,l,t,w,h,s.x-(s.anchor[0]-l)*k,y+8-(s.anchor[1]-t)*k,w*k,h*k);
  ctx.fillStyle='#e4dfcf';ctx.font='13px Microsoft YaHei';ctx.textAlign='center';ctx.fillText(s.label,s.x,211);
 }
 document.documentElement.dataset.ready='true';
}).catch(e=>{document.documentElement.dataset.error=e.message;throw e;});
</script>
</html>
