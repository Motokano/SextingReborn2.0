  &lt;details id=&quot;gb-conditions&quot;&gt;&lt;summary class=&quot;cursor-interaction&quot;&gt;时间与中断条件&lt;/summary&gt;&lt;div class=&quot;flow-actions&quot;&gt;&lt;button type=&quot;button&quot; class=&quot;btn&quot; data-act=&quot;near&quot;&gt;走近&lt;/button&gt;&lt;button type=&quot;button&quot; class=&quot;btn&quot; data-act=&quot;far&quot;&gt;走远两格&lt;/button&gt;&lt;button type=&quot;button&quot; class=&quot;btn&quot; data-act=&quot;barrier&quot;&gt;模拟隔墙&lt;/button&gt;&lt;button type=&quot;button&quot; class=&quot;btn&quot; data-act=&quot;tick&quot;&gt;经过1刻&lt;/button&gt;&lt;button type=&quot;button&quot; class=&quot;btn&quot; data-act=&quot;ten-ticks&quot;&gt;经过10刻&lt;/button&gt;&lt;button type=&quot;button&quot; class=&quot;btn&quot; data-act=&quot;travel&quot;&gt;离开地图&lt;/button&gt;&lt;button type=&quot;button&quot; class=&quot;btn&quot; data-act=&quot;die&quot;&gt;模拟死亡&lt;/button&gt;&lt;/div&gt;&lt;/details&gt;
  &lt;details&gt;&lt;summary class=&quot;cursor-interaction&quot;&gt;查看完整规则&lt;/summary&gt;
    &lt;dl class=&quot;flow-rules text-small&quot;&gt;
      &lt;dt&gt;放下&lt;/dt&gt;&lt;dd&gt;本体与内容一起落地；物品数量、格位、组合部件及水量保留。人物负重立即扣除整包。&lt;/dd&gt;
      &lt;dt&gt;接近&lt;/dt&gt;&lt;dd&gt;同格或上下左右相邻一格可操作；必须同地图、可感知、无墙门等阻挡。远处先走近，移动照常耗时。&lt;/dd&gt;
      &lt;dt&gt;打开&lt;/dt&gt;&lt;dd&gt;只打开这只地面包；不占装备槽，不把内容转成随身物品，不抽取奖励或重新搜索。&lt;/dd&gt;
      &lt;dt&gt;查看&lt;/dt&gt;&lt;dd&gt;按原格位显示，沿用认知限制；显示占用格数、实际总重、词条与改造。打开窗口不重置物品状态。&lt;/dd&gt;
      &lt;dt&gt;取出&lt;/dt&gt;&lt;dd&gt;进入右侧选定容器；按该容器类别、格数和数量限制检查。放不下时原位保留，不自动散投到别处。&lt;/dd&gt;
      &lt;dt&gt;放入&lt;/dt&gt;&lt;dd&gt;由右侧存入左侧地面包；按现有规则合并或使用空格，满包不挤出旧物。装备先卸下，工作占用物不可移动。&lt;/dd&gt;
      &lt;dt&gt;数量&lt;/dt&gt;&lt;dd&gt;选择本次转移数量，默认整份；实际堆叠上限沿用物品配置。请求数量不适配时整次拒绝，不吞余量。&lt;/dd&gt;
      &lt;dt&gt;全部取出&lt;/dt&gt;&lt;dd&gt;按格序尝试完整物品／完整栈，放不下或被占用的留原格，后续可放项继续；报告移动与剩余占格数。&lt;/dd&gt;
      &lt;dt&gt;单件放地上&lt;/dt&gt;&lt;dd&gt;物品出现在背包所在格。取空仍保留空背包，可继续装物；不自动拾起、销毁或一键倒空。&lt;/dd&gt;
      &lt;dt&gt;背上与换包&lt;/dt&gt;&lt;dd&gt;目标包连自己的内容成为装备；旧包连原内容放在玩家脚下。两包内容不自动交换，操作后关闭原地面窗口。&lt;/dd&gt;
      &lt;dt&gt;拾起整包&lt;/dt&gt;&lt;dd&gt;有物品的包可以整体收进可用载具；不能放进另一只背包、口袋或背心。空包可作为备用物品收纳。&lt;/dd&gt;
      &lt;dt&gt;禁止套包&lt;/dt&gt;&lt;dd&gt;包内备用空包只能作为一件物品；必须先取出到地面或装备才能打开装物，不递归扩容或减重。&lt;/dd&gt;
      &lt;dt&gt;使用物品&lt;/dt&gt;&lt;dd&gt;先取出再饮用、食用、施药或使用。打开地面包不把里面的材料加入制作、加工或快捷栏来源。&lt;/dd&gt;
      &lt;dt&gt;重量与保鲜&lt;/dt&gt;&lt;dd&gt;地面包不计人物负重；取出后按目的容器重新计重。减重和包内保鲜仅在装备时生效，地面食物照常累计腐坏。&lt;/dd&gt;
      &lt;dt&gt;时间&lt;/dt&gt;&lt;dd&gt;整理、开关、整包移动与换包首版沿用0刻；走路和使用物品按原动作耗时，窗口不新增冻结或免伤。&lt;/dd&gt;
      &lt;dt&gt;中断&lt;/dt&gt;&lt;dd&gt;离开范围、跨图、失能、死亡，或包被拿走／清理时关闭窗口；旧选中项不能操作同格后来出现的另一只包。&lt;/dd&gt;
      &lt;dt&gt;清理&lt;/dt&gt;&lt;dd&gt;非地牢落地100世界刻清理整包；开包和存取不刷新落地时间。地牢不走此计时分支，但仍受地牢实例生命周期约束。&lt;/dd&gt;
      &lt;dt&gt;死亡&lt;/dt&gt;&lt;dd&gt;当时装备、随身容器和绑定载具中的整包丢失。此前主动放下的包按地面归属处理；家仓及已学方法保留，不新增死亡掉包。&lt;/dd&gt;
      &lt;dt&gt;保存&lt;/dt&gt;&lt;dd&gt;每次操作立即保存；数量与唯一归属守恒。保存失败整次回退，批量操作也不留下半笔变化；读档不重新生成内容。&lt;/dd&gt;
    &lt;/dl&gt;

  &lt;script&gt;
  (()=&gt;{
    const root=document.getElementById(&#x27;ground-bag-flow-1101&#x27;),q=id=&gt;root.querySelector(&#x27;#&#x27;+id),copy=x=&gt;JSON.parse(JSON.stringify(x));
    const thumb=q(&#x27;gb-art&#x27;).src;
    const models={light:{name:&#x27;轻便帆布包&#x27;,slots:12,kg:.5,factor:.75},collector:{name:&#x27;多袋搜集包&#x27;,slots:24,kg:1.5,factor:.9},hauler:{name:&#x27;框架搬运包&#x27;,slots:16,kg:3,factor:.5}};
    const item=(id,type,name,kg,count=1,extra={})=&gt;({id,type,name,kg,count,max:20,pocket:true,...extra});
    const supplies=()=&gt;[item(&#x27;ore&#x27;,&#x27;ore&#x27;,&#x27;矿料&#x27;,2,3,{pocket:false}),item(&#x27;food&#x27;,&#x27;food&#x27;,&#x27;干粮&#x27;,.2,2,{age:17.4}),item(&#x27;flask&#x27;,&#x27;flask&#x27;,&#x27;铁皮水壶&#x27;,.7,1,{max:1,water:125}),item(&#x27;knife&#x27;,&#x27;tool&#x27;,&#x27;折叠工具&#x27;,.5,1,{max:1})];
    const bag=(id,model,items=[])=&gt;({id,kind:&#x27;bag&#x27;,model,...models[model],count:1,max:1,pocket:false,items:Array.from({length:models[model].slots},(_,i)=&gt;items[i]||null),affixes:[],modification:null,fresh:1});
    function fresh(scenario){
      const s={version:1,scenario,tick:0,serial:20,map:&#x27;home&#x27;,returnMap:null,x:1,y:1,barrier:false,dead:false,eq:bag(&#x27;a&#x27;,&#x27;light&#x27;,supplies()),pocket:[item(&#x27;cloth&#x27;,&#x27;cloth&#x27;,&#x27;棉布&#x27;,.1,1),item(&#x27;cloth2&#x27;,&#x27;cloth&#x27;,&#x27;棉布&#x27;,.1,1),null,null],vehicle:null,ground:[],target:null,opened:null,dest:&#x27;backpack&#x27;,left:null,right:null,message:&#x27;先点「整包放下」，查看包体和内容如何一起落地。&#x27;,failed:false,failNext:false};
      const ground=(b,x=1,y=1)=&gt;{s.ground.push({item:b,x,y,map:&#x27;home&#x27;,drop:0});s.target=b.id;};
      if(scenario===&#x27;normal&#x27;)return s;
      if(scenario===&#x27;transfer&#x27;||scenario===&#x27;failure&#x27;||scenario===&#x27;expiry&#x27;||scenario===&#x27;dungeon&#x27;||scenario===&#x27;reach&#x27;){ground(s.eq,scenario===&#x27;reach&#x27;?4:1,1);s.eq=null;s.dest=&#x27;pocket&#x27;;s.opened=s.target;s.message=&#x27;选中左侧物品，再取出到右侧容器；也可以反向放入。&#x27;;}
      if(scenario===&#x27;full&#x27;){s.eq=bag(&#x27;a&#x27;,&#x27;light&#x27;,Array.from({length:11},(_,i)=&gt;item(&#x27;occupied&#x27;+i,&#x27;tool&#x27;,&#x27;工具&#x27;+(i+1),.5,1,{max:1})));ground(bag(&#x27;b&#x27;,&#x27;collector&#x27;,supplies()));s.opened=&#x27;b&#x27;;s.message=&#x27;右侧只剩1格。点击「全部取出」，检查放不下的物品是否留在原包。&#x27;;}
      if(scenario===&#x27;swap&#x27;){ground(bag(&#x27;b&#x27;,&#x27;hauler&#x27;,[item(&#x27;heavy&#x27;,&#x27;ore&#x27;,&#x27;矿料&#x27;,2,4,{pocket:false})]));s.opened=&#x27;b&#x27;;s.message=&#x27;两包内容不同。点击「换上此包」，旧包会连内容放在脚下。&#x27;;}
      if(scenario===&#x27;empty&#x27;){ground(bag(&#x27;b&#x27;,&#x27;collector&#x27;));s.opened=&#x27;b&#x27;;s.message=&#x27;左侧是空包。选中右侧物品放入，取空后包体仍保留。&#x27;;}
      if(scenario===&#x27;vehicle&#x27;){ground(s.eq);s.eq=null;s.dest=&#x27;vehicle&#x27;;s.vehicle=[bag(&#x27;b&#x27;,&#x27;hauler&#x27;,[item(&#x27;load&#x27;,&#x27;ore&#x27;,&#x27;矿料&#x27;,2,2,{pocket:false})]),null];s.opened=&#x27;a&#x27;;s.message=&#x27;可整包收进载具；选中右侧装有物品的包再尝试放入左侧，可检查禁止套包。&#x27;;}
      if(scenario===&#x27;reach&#x27;){s.x=0;s.opened=null;s.message=&#x27;目标在4格外。先点「走近」；模拟隔墙后，再尝试打开。&#x27;;}
      if(scenario===&#x27;expiry&#x27;){s.tick=98;s.message=&#x27;该包已落地98刻。开包或存取不会续期，再经过2刻整包清理。&#x27;;}
      if(scenario===&#x27;dungeon&#x27;){s.tick=98;s.map=&#x27;dungeon&#x27;;s.ground.forEach(e=&gt;e.map=&#x27;dungeon&#x27;);s.message=&#x27;地牢地面不按100刻清理；这不代表结束出征后仍能找回。&#x27;;}
      if(scenario===&#x27;failure&#x27;){s.failNext=true;s.message=&#x27;下一次有效物品移动将模拟保存失败；检查物品与数量是否恢复原位。&#x27;;}
      if(scenario===&#x27;death&#x27;){ground(bag(&#x27;b&#x27;,&#x27;hauler&#x27;,[item(&#x27;cached&#x27;,&#x27;food&#x27;,&#x27;干粮&#x27;,.2,3,{age:5})]));s.vehicle=[item(&#x27;vtool&#x27;,&#x27;tool&#x27;,&#x27;备用工具&#x27;,1,1,{max:1})];s.opened=&#x27;b&#x27;;s.message=&#x27;地面有一只包，身上另有一只。模拟死亡，查看各自的去向。&#x27;;}
      return s;
    }
    function restore(saved){const a=saved?.privateContent?.state;return a?.version===1&amp;&amp;Array.isArray(a.ground)&amp;&amp;Array.isArray(a.pocket)&amp;&amp;Number.isFinite(a.tick)?copy(a):null;}
    let s=restore(window.openai?.widgetState)||fresh(&#x27;normal&#x27;);
    function target(){return s.ground.find(e=&gt;e.item.id===s.target&amp;&amp;e.item.kind===&#x27;bag&#x27;&amp;&amp;e.map===s.map);}
    function access(e=target()){if(s.dead)return&#x27;角色已死亡，不能继续操作&#x27;;if(!e)return&#x27;这只背包已不在当前地面&#x27;;if(e.map!==s.map)return&#x27;背包不在当前地图&#x27;;if(Math.abs(e.x-s.x)+Math.abs(e.y-s.y)&gt;1)return&#x27;距离太远，请先走近&#x27;;if(s.barrier)return&#x27;有墙或关闭的门阻挡&#x27;;return&#x27;&#x27;;}
    function active(){const e=target();return e&amp;&amp;s.opened===e.item.id&amp;&amp;!access(e)?e.item:null;}
    function count(a){return a.filter(Boolean).length;}
    function mass(it){if(!it)return 0;if(it.kind===&#x27;bag&#x27;)return it.kg+it.items.reduce((n,x)=&gt;n+mass(x),0);return(it.kg+(it.water||0)*.005)*it.count;}
    function burden(){return(s.eq?s.eq.kg+s.eq.items.reduce((n,x)=&gt;n+mass(x),0)*s.eq.factor:0)+s.pocket.reduce((n,x)=&gt;n+mass(x),0);}
    function container(){if(s.dest===&#x27;backpack&#x27;)return s.eq?{array:s.eq.items,name:&#x27;装备背包&#x27;,kind:&#x27;bag&#x27;}:null;if(s.dest===&#x27;vehicle&#x27;)return s.vehicle?{array:s.vehicle,name:&#x27;载具&#x27;,kind:&#x27;vehicle&#x27;}:null;return{array:s.pocket,name:&#x27;口袋&#x27;,kind:&#x27;pocket&#x27;};}
    function ensureDest(){if(s.dest===&#x27;backpack&#x27;&amp;&amp;!s.eq||s.dest===&#x27;vehicle&#x27;&amp;&amp;!s.vehicle)s.dest=s.eq?&#x27;backpack&#x27;:&#x27;pocket&#x27;;}
    function validOpen(){if(s.opened&amp;&amp;(!target()||s.opened!==s.target||access())){s.opened=null;s.left=null;return false;}return true;}
    function persist(){const snapshot={modelContent:{scenario:s.scenario,equipped:s.eq?.name||&#x27;未装备&#x27;,ground:s.ground.filter(e=&gt;e.item.kind===&#x27;bag&#x27;).map(e=&gt;({name:e.item.name,slots:count(e.item.items),map:e.map})),tick:s.tick,lastResult:s.message},privateContent:{state:s}};if(JSON.stringify(snapshot).length&lt;15500)window.openai?.setWidgetState?.(snapshot)?.catch(()=&gt;{});}
    function invariant(){const ids=new Set();function visit(it){if(!it)return;if(ids.has(it.id))throw new Error(&#x27;物品身份重复，操作已撤回&#x27;);ids.add(it.id);if(it.kind===&#x27;bag&#x27;){if(count(it.items)&gt;it.slots)throw new Error(&#x27;背包容量超出&#x27;);it.items.forEach(visit);}else if(!Number.isInteger(it.count)||it.count&lt;1)throw new Error(&#x27;物品数量错误&#x27;);}visit(s.eq);s.pocket.forEach(visit);s.vehicle?.forEach(visit);s.ground.forEach(e=&gt;visit(e.item));}
    function transact(fn){const before=copy(s);try{if(s.dead)throw new Error(&#x27;角色已死亡，不能继续操作&#x27;);const text=fn();invariant();if(s.failNext){s=before;s.failNext=false;s.message=&#x27;保存失败：本次物品、数量和格位全部恢复原位。可以重试。&#x27;;s.failed=true;}else{s.message=text;s.failed=false;}}catch(e){s=before;s.message=e.message;s.failed=true;}ensureDest();validOpen();render();persist();}
    function selected(side){const a=side===&#x27;left&#x27;?active()?.items:container()?.array,id=s[side];return a?.find(it=&gt;it?.id===id)||null;}
    function quantity(side,it){const n=Number(q(&#x27;gb-&#x27;+side+&#x27;-qty&#x27;).value);if(!Number.isInteger(n)||n&lt;1||n&gt;it.count)throw new Error(&#x27;请选择有效的转移数量&#x27;);return n;}
    function put(dest,it){
      if(it.kind===&#x27;bag&#x27;&amp;&amp;count(it.items)&gt;0&amp;&amp;dest.kind!==&#x27;vehicle&#x27;)throw new Error(&#x27;装有物品的背包不能塞进另一只背包或口袋；可以整包收进载具。&#x27;);
      if(dest.kind===&#x27;pocket&#x27;&amp;&amp;(!it.pocket||it.kind===&#x27;bag&#x27;))throw new Error(&#x27;这件物品不能放入口袋，请换一个目的容器。&#x27;);
      const arr=dest.array,cap=dest.kind===&#x27;pocket&#x27;?1:it.max,old=copy(arr);let remaining=it.count,placed=false;
      if(it.kind!==&#x27;bag&#x27;&amp;&amp;it.max&gt;1&amp;&amp;dest.kind!==&#x27;pocket&#x27;)for(const cell of arr){if(cell&amp;&amp;cell.type===it.type&amp;&amp;cell.name===it.name&amp;&amp;cell.kg===it.kg&amp;&amp;!cell.locked){const n=Math.min(remaining,cap-cell.count);if(n&gt;0){cell.count+=n;remaining-=n;if(it.age!=null)cell.age=Math.max(cell.age||0,it.age);placed=true;}if(!remaining)break;}}
      while(remaining&gt;0){let index=arr.findIndex(x=&gt;!x);if(index&lt;0&amp;&amp;dest.kind===&#x27;vehicle&#x27;){index=arr.length;arr.push(null);}if(index&lt;0){arr.splice(0,arr.length,...old);throw new Error(&#x27;目的容器空间不足，物品留在原处。&#x27;);}const n=Math.min(remaining,cap);const piece=copy(it);piece.count=n;if(placed||n&lt;it.count)piece.id=&#x27;split-&#x27;+(++s.serial);arr[index]=piece;remaining-=n;placed=true;}
    }
    function move(source,it,n,dest){const index=source.findIndex(x=&gt;x?.id===it.id);if(index&lt;0)throw new Error(&#x27;物品已移动，请重新选择&#x27;);if(it.locked)throw new Error(&#x27;物品正在使用，不能移动&#x27;);const portion=copy(it);portion.count=n;if(n&lt;it.count)portion.id=&#x27;split-&#x27;+(++s.serial);put(dest,portion);if(n===it.count)source[index]=null;else source[index].count-=n;}
    function requireOpen(){const why=access();if(why)throw new Error(why);const b=active();if(!b)throw new Error(&#x27;请先打开地面背包&#x27;);return b;}
    function ground(it,x=s.x,y=s.y){s.ground.push({item:it,map:s.map,x,y,drop:s.tick});if(it.kind===&#x27;bag&#x27;){s.target=it.id;s.opened=null;s.left=null;}}
