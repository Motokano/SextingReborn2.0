<!doctype html><meta charset="utf-8"><title>车床 2×1 格几何参考</title><style>body{margin:0;background:#ece8dd}svg{display:block;width:768px;height:768px}</style><svg id="guide" viewBox="0 0 1280 1280" xmlns="http://www.w3.org/2000/svg"></svg><script>
const svg=document.getElementById('guide'),NS=svg.namespaceURI;
const p=(u,v,z=0)=>[480+(u-v)*340,450+(u+v)*340/Math.SQRT2-z*370];
function poly(a,fill,stroke='#33352f'){const e=document.createElementNS(NS,'polygon');e.setAttribute('points',a.map(v=>p(...v).join(',')).join(' '));e.setAttribute('fill',fill);e.setAttribute('stroke',stroke);e.setAttribute('stroke-width',5);e.setAttribute('stroke-linejoin','round');svg.append(e);}
function box(u,v,w,d,z,h){poly([[u,v+d,z],[u+w,v+d,z],[u+w,v+d,z+h],[u,v+d,z+h]],'#526968');poly([[u+w,v,z],[u+w,v+d,z],[u+w,v+d,z+h],[u+w,v,z+h]],'#354b4c');poly([[u,v,z+h],[u+w,v,z+h],[u+w,v+d,z+h],[u,v+d,z+h]],'#96a9a0');}
poly([[0,0],[2,0],[2,1],[0,1]],'#d8cfb7','#9d927d');
box(0,.15,.42,.7,0,.6);box(1.58,.15,.42,.7,0,.6);
box(0,.12,2,.76,.6,.08);
box(0,.12,.48,.76,.68,.42);

</script>
