<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><base href="../"><title>藏身处 · 健身房</title><link rel="icon" href="data:,"><link rel="stylesheet" href="tools/gym-prototype.css"><link rel="stylesheet" href="css/npc-menu.css"><style>
html,body{height:100%}body{display:flex;flex-direction:column}.review-nav{padding:8px 24px;display:flex;align-items:center;gap:10px;border-bottom:1px solid #44514077;z-index:2}.review-nav button,.review-nav select{font-size:12px;padding:5px 11px}.review-nav label{display:flex;gap:8px;align-items:center;font-size:12px;margin-left:auto}.review-nav button[aria-pressed=true]{color:#f3d790;border-color:#a58c50;background:#3c432a}#viewport{position:relative;flex:1;overflow:hidden;min-height:200px;background:radial-gradient(ellipse at 50% 48%,#2c3024,#121a14 78%)}#world{position:absolute;transform-origin:0 0;width:auto;height:auto;min-width:0}#world canvas{position:absolute;inset:0;pointer-events:none}#labels{position:absolute;inset:0;z-index:30;pointer-events:none}.label{position:absolute;transform:translate(-50%,0);padding:5px 9px;background:#19251cde;border:1px solid #7c815b99;border-radius:4px;white-space:nowrap;color:#f3dfac;font-size:18px}.label.existing{color:#d1dac9;border-color:#64705e}.label.door{color:#dbe8d1;background:#36523be8}.gym-pawn{pointer-events:auto;width:155px;height:105px;border:0!important;background:transparent!important;transform:translate(-50%,-78%);display:flex;align-items:end;justify-content:center}.gym-pawn span{padding:5px 9px;background:#19251ce8;border:1px solid #7c815b99;border-radius:4px}.gym-pawn:hover span,.gym-pawn.selected span{color:#ffe2a1;border-color:#d6bc7e}.gym-pawn.unbuilt span{border-style:dashed;color:#a7a48a}.gym-pawn:disabled{opacity:.7}#plan{position:absolute;inset:0;width:100%;height:100%}#error{color:#edaa8f}#notice,#active-job{z-index:40}#inventory{font-size:12px}.hud h1{letter-spacing:.05em}@media(max-width:650px){.review-nav{padding:8px 12px;gap:5px}.review-nav button,.review-nav select{padding:5px 8px}.hud h1{font-size:16px}}
</style></head><body data-gym-host="hideout">
<header class="hud"><h1>藏身处 · 健身房</h1><div id="resources" class="resources"></div><div class="hud-actions"><button id="muscles">肌群</button><button id="inventory">物资</button><details id="demo-settings"><summary>试玩设置</summary><div class="settings-body"><label>情境<select id="scenario"><option value="fresh">从零开始</option><option value="built">器械齐备</option><option value="maxed">器械满级</option><option value="near">肩带即将练满</option><option value="tired">疲劳65</option><option value="low">体力不足</option></select></label><button id="reset">重置</button><button id="supply">补充物资</button></div></details></div></header>
<nav class="review-nav" aria-label="场景视图"><button id="plan-view" aria-pressed="false">平面</button><button id="all-view" aria-pressed="false">全景</button><button id="gym-view" aria-pressed="true">健身房</button><label>器械<select id="level" aria-label="器械等级"><option value="1">1级</option><option value="2">2级</option><option value="3">3级</option><option value="4">4级</option></select></label><span id="error" role="status"></span></nav>
<main id="viewport"><div id="world"><div id="labels"></div></div><canvas id="plan" aria-label="藏身处健身房平面布局" hidden></canvas><button id="active-job" hidden></button><div id="notice" role="status" aria-live="polite" hidden></div></main>
<dialog id="interaction" aria-labelledby="interaction-title"><header class="window-head"><h2 id="interaction-title"></h2><button id="close" aria-label="关闭">×</button></header><div id="window-content"></div></dialog>
<script>const previewStorage=new Map();Object.defineProperty(window,'localStorage',{value:{getItem:k=>previewStorage.get(k)??null,setItem:(k,v)=>previewStorage.set(k,String(v)),removeItem:k=>previewStorage.delete(k)}});</script>
<script src="js/food-metabolism.js"></script><script src="js/game-time.js"></script><script src="js/survival.js"></script><script src="js/muscles.js"></script><script src="js/dungeon/ui-icons.js"></script><script src="js/npc-system.js"></script><script src="js/gym-facility.js"></script>
<script src="js/core/map-projection.js"></script><script src="js/core/base-hideout-art.js"></script><script src="js/core/tile-renderer-v2.js"></script><script type="module" src="tools/gym-hideout-review.mjs"></script></body></html>
