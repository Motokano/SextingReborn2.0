<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>物品编辑器 - 潮碧物语</title>
    <style>
        :root{
            --bg: #0b1020;
            --bg2:#0f172a;
            --panel:#0b1324;
            --border: rgba(148,163,184,0.18);
            --border2: rgba(148,163,184,0.28);
            --text:#e5e7eb;
            --muted:#94a3b8;
            --muted2:#64748b;
            --primary:#60a5fa;
            --danger:#ef4444;
            --shadow: 0 18px 60px rgba(0,0,0,0.45);
            --radius: 12px;
        }
        *{ box-sizing: border-box; }
        body{
            margin: 0;
            font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, "Helvetica Neue", Arial, "Noto Sans", "Liberation Sans", sans-serif;
            background: radial-gradient(1200px 800px at 30% 0%, rgba(96,165,250,0.10), transparent 55%),
                        linear-gradient(180deg, var(--bg), #070a14 70%);
            color: var(--text);
        }
        .wrapText{
            white-space: normal;
            overflow-wrap: anywhere;
            word-break: break-word;
        }
        .toolbar{
            position: sticky; top: 0; z-index: 50;
            padding: 12px 16px;
            background: rgba(10,18,34,0.86);
            border-bottom: 1px solid var(--border);
            backdrop-filter: blur(10px);
            display:flex; gap:10px; align-items:center; flex-wrap:wrap;
        }
        button{
            appearance:none;
            border: 1px solid var(--border);
            background: rgba(148,163,184,0.10);
            color: var(--text);
            cursor: pointer;
            border-radius: 10px;
            padding: 8px 12px;
            font-size: 12px;
            font-weight: 800;
        }
        button.primary{
            background: linear-gradient(180deg, rgba(96,165,250,0.22), rgba(96,165,250,0.10));
            border-color: rgba(96,165,250,0.45);
        }
        button.danger{
            background: linear-gradient(180deg, rgba(239,68,68,0.18), rgba(239,68,68,0.08));
            border-color: rgba(239,68,68,0.38);
        }
        input, select, textarea{
            background: rgba(148,163,184,0.10);
            border: 1px solid var(--border);
            color: var(--text);
            border-radius: 10px;
            padding: 8px 12px;
            outline: none;
            font-size: 12px;
        }
        /* QoL: select/option 在部分浏览器中会覆盖继承，强制可读配色 */
        select{
            background: rgba(148,163,184,0.10) !important;
            color: var(--text) !important;
        }
        option{
            background: #0b1324 !important;
            color: #e5e7eb !important;
        }
        #row-select, #col-select{
            background: rgba(148,163,184,0.10) !important;
            color: var(--text) !important;
        }
        textarea{
            min-height: 42px;
            width: 100%;
            resize: vertical;
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
        }
        .wrap{
            display:grid;
            grid-template-columns: 300px 1fr;
            gap: 14px;
            padding: 14px;
        }
        @media (max-width: 1100px){ .wrap{ grid-template-columns: 1fr; } }
        .panel{
            border: 1px solid var(--border);
            background: rgba(11,19,36,0.68);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            overflow:hidden;
        }
        .panel .title{
            padding: 12px 14px;
            border-bottom: 1px solid var(--border);
            color: var(--muted);
            font-size: 12px;
            font-weight: 900;
        }
        .panel .content{ padding: 12px 14px; }
        .hint{
            color: var(--muted2);
            font-size: 12px;
            line-height: 1.5;
            white-space: normal;
            overflow-wrap: anywhere;
            word-break: break-word;
        }
        .err{
            color: #fecaca;
            background: rgba(239,68,68,0.12);
            border: 1px solid rgba(239,68,68,0.35);
            padding: 10px 12px;
            border-radius: 10px;
            white-space: pre-wrap;
            font-size: 12px;
            display:none;
        }
        .grid2{ display:grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        @media (max-width: 900px){ .grid2{ grid-template-columns: 1fr; } }
        .colList{ display:grid; gap: 8px; margin-top: 12px; }
        .colItem{
            display:flex; gap: 10px; align-items:center;
            padding: 8px 10px;
            border: 1px solid var(--border);
            border-radius: 10px;
            background: rgba(148,163,184,0.08);
        }
        .colItem .colName{
            flex: 1;
            min-width: 0;
            overflow:hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            font-weight: 1000;
            font-size: 12px;
        }
        .colItem .meta{ color: var(--muted2); font-size: 12px; overflow:hidden; white-space: nowrap; text-overflow: ellipsis; }
        .field{
            display:grid;
            grid-template-columns: 180px 1fr;
            gap: 10px;
            align-items:start;
            margin: 10px 0;
        }
        @media (max-width: 900px){ .field{ grid-template-columns: 1fr; } }
        .field label{
            color: var(--muted);
            font-weight: 1000;
            font-size: 12px;
            white-space: normal;
            overflow-wrap: anywhere;
            word-break: break-word;
        }
        .rowEditor{ padding-top: 6px; }
        .rowActions{ display:flex; gap: 10px; flex-wrap:wrap; margin-top: 12px; }
        .rowTop{
            display:flex; gap: 10px; align-items:center; flex-wrap:wrap;
            margin-top: 6px;
        }
        .rowTop .grow{ flex: 1; min-width: 240px; }
        .rowTop select{ width: 100%; }
    </style>
</head>
<body>
<div class="toolbar">
    <button type="button" id="btn-load-materials">载入示例：materials_base.csv</button>
    <label style="display:flex; gap:10px; align-items:center;">
        <span style="color: var(--muted); font-weight:900; font-size:12px;">选择 CSV 文件</span>
        <input id="file-input" type="file" accept=".csv,text/csv" style="padding:6px 10px; border-radius: 10px;" />
    </label>

    <div style="flex-basis:100%; height:0;"></div>

    <div style="display:flex; gap:10px; align-items:center; flex-wrap:wrap; width:100%;">
        <div style="flex:1; min-width:260px;">
            <div class="hint" id="status-line">未加载 CSV</div>
        </div>
        <div style="flex:1; min-width:260px;">
            <label class="hint" style="display:block; margin-bottom:6px;">物品行</label>
            <select id="row-select"></select>
        </div>
    </div>
</div>

<div class="wrap">
    <div class="panel">
        <div class="title">字段（属性）：可删减 / 可扩展</div>
        <div class="content">
            <div class="hint">
                列名会作为“属性字段”。你可以删除任意非 `id` 列；也可以新增列，新增后所有行都会补空值。
            </div>

            <div class="grid2" style="margin-top:12px;">
                <div>
                    <label class="hint" style="display:block; margin-bottom:6px;">新字段名</label>
                    <input id="new-col-name" placeholder="例如: damage_reduce_slash_pct" />
                </div>
                <div>
                    <label class="hint" style="display:block; margin-bottom:6px;">默认值（可空）</label>
                    <input id="new-col-default" placeholder="空则留空" />
                </div>
            </div>

            <div class="rowActions">
                <button type="button" class="primary" id="btn-add-col">添加字段</button>
                <button type="button" class="danger" id="btn-delete-col">删除选中字段</button>
            </div>

            <div class="rowTop">
                <div class="grow">
                    <label class="hint" style="display:block; margin-bottom:6px;">字段选择</label>
                    <select id="col-select"></select>
                </div>
            </div>

            <div class="colList" id="col-list"></div>
            <div id="err-box" class="err"></div>
        </div>
    </div>

    <div class="panel">
        <div class="title">编辑行：单个物品的所有属性</div>
        <div class="content">
            <div class="hint">
                当前会以 CSV 表头定义的字段集合渲染。修改任意字段都会更新内存数据，导出时会带上所有改动。
            </div>
            <div class="rowEditor" id="row-editor"></div>

            <div class="rowActions">
                <button type="button" class="primary" id="btn-new-row">新增物品行</button>
                <button type="button" id="btn-export-csv">导出 CSV</button>
                <button type="button" id="btn-export-items-json" title="简化：把每行转换为 items.json 形状">导出简化 items.json</button>
            </div>
            <div class="hint" id="export-hint" style="margin-top:10px;"></div>
        </div>
    </div>
</div>

<script>
(function(){
    'use strict';

    // ---------- CSV 解析/导出 ----------
    function parseCsv(text){
        text = String(text || '').replace(/^\uFEFF/, '');
        var rows = [];
        var row = [];
        var field = '';
        var inQuotes = false;

        for (var i = 0; i < text.length; i++){
            var c = text[i];
            if (inQuotes){
                if (c === '"'){
                    if (text[i + 1] === '"'){
                        field += '"';
                        i++;
                    } else {
                        inQuotes = false;
                    }
                } else {
                    field += c;
                }
            } else {
                if (c === '"'){
                    inQuotes = true;
                } else if (c === ','){
                    row.push(field);
                    field = '';
                } else if (c === '\n'){
                    row.push(field);
                    rows.push(row);
                    row = [];
                    field = '';
                } else if (c === '\r'){
                    // ignore
                } else {
                    field += c;
                }
            }
        }

        // flush last
        if (field.length > 0 || row.length > 0){
            row.push(field);
            rows.push(row);
        }

        while (rows.length && rows[rows.length - 1].every(function(v){ return v === ''; })){
            rows.pop();
        }
        if (!rows.length) return { headers: [], rows: [] };

        var headers = rows[0].map(function(h){ return String(h || '').trim(); });
        // 补齐空列名为 extra_N
        for (var hi = 0; hi < headers.length; hi++){
            if (!headers[hi]) headers[hi] = 'extra_' + (hi + 1);
        }

        var dataRows = [];
        for (var r = 1; r < rows.length; r++){
            var arr = rows[r];
            // 如果这一行比表头长，额外字段会被忽略（保持“可删减/可扩展”以列为中心）
            var obj = {};
            for (var c2 = 0; c2 < headers.length; c2++){
                obj[headers[c2]] = arr[c2] == null ? '' : String(arr[c2]);
            }
            dataRows.push(obj);
        }
        return { headers: headers, rows: dataRows };
    }

    function csvEscape(value){
        var s = value == null ? '' : String(value);
        if (/[",\n\r]/.test(s)) return '"' + s.replace(/"/g, '""') + '"';
        return s;
    }

    function stringifyCsv(headers, rows){
        var out = [];
        out.push(headers.join(','));
        for (var i = 0; i < rows.length; i++){
            var r = rows[i];
            var arr = [];
            for (var h = 0; h < headers.length; h++){
                arr.push(csvEscape(r[headers[h]]));
            }
            out.push(arr.join(','));
        }
        return out.join('\n');
    }

    function download(filename, text, mime){
        mime = mime || 'text/plain;charset=utf-8';
        var blob = new Blob([text], { type: mime });
        var a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        setTimeout(function(){
            document.body.removeChild(a);
            URL.revokeObjectURL(a.href);
        }, 0);
    }

    // ---------- 字段提示（以 items_template_and_style.md 关键字段为参考） ----------
    var FIELD_HINTS = {
        id: '物品内部唯一 ID（建议全小写英文+下划线）',
        sn: '真实展示名称（简体中文，2~6字）',
        placeholder_name: '未鉴定/未识字时的模糊称呼（<=8汉字，简体）',
        fn_before: '鉴定前说明（仅基础材料使用：外观描述 + 可能用途，用中文逗号分隔）',
        fn: '鉴定后说明（角色视角，短句）',
        category: '物品大类（ore/wood/herb/hunt/textile/currency...）',
        sub_category: '大类下细分（non_ferrous/black_metal...）',
        weight: '材料/消耗品表的单件重量列名',
        weight_kg: '运行时 items.json 常用字段名',
        stack_limit: '单格最大堆叠数量',
        tags: '英文小写标签，用分号 ; 分隔',
        source: '主要获得方式（mining/logging/gathering...）',
        production_lines: '生产线类型（forge;craft...）',
        spoilage: '腐败属性（none/slow/fast）',
        price_class: '贸易价值定位（life_good/material/rare/luxury）',
        volatility: '价格波动（low/mid/high）',
        region_restrict: '生成地区限制（0=全局，其它需与地区体系匹配）',
        base_value: '贸易内部基线价值（不对玩家展示）',
        accept_code: '商人接受货币短码',
        convert_to_high: '低级→高级兑换依据（"目标id,比例"）',
        usable_regions: '货币可用地区代号（分号分隔）',
        satiety_restore: '食物：使用一次恢复饱食度',
        thirst_restore: '饮用/带水分消耗：使用一次恢复饮水度',
        nutrition_restore: '食物：使用一次恢复营养值',
        pocket_slots: '运行时：口袋格数（装备常用）',
        vest_slots: '运行时：背心格数（装备常用）',
        backpack_slots: '运行时：背包格数（装备常用）'
    };

    // ---------- 状态 ----------
    var state = {
        headers: [],
        rows: [], // Array<obj>
        selectedRowIndex: 0,
        selectedColIndex: 0
    };

    var $ = function(id){ return document.getElementById(id); };
    var el = {
        statusLine: $('status-line'),
        fileInput: $('file-input'),
        btnLoadMaterials: $('btn-load-materials'),

        rowSelect: $('row-select'),
        colSelect: $('col-select'),
        colList: $('col-list'),

        newColName: $('new-col-name'),
        newColDefault: $('new-col-default'),
        btnAddCol: $('btn-add-col'),
        btnDeleteCol: $('btn-delete-col'),

        rowEditor: $('row-editor'),
        btnNewRow: $('btn-new-row'),

        btnExportCsv: $('btn-export-csv'),
        btnExportItemsJson: $('btn-export-items-json'),

        errBox: $('err-box'),
        exportHint: $('export-hint')
    };

    function showError(msg){
        el.errBox.textContent = String(msg || '');
        el.errBox.style.display = 'block';
    }
    function clearError(){
        el.errBox.textContent = '';
        el.errBox.style.display = 'none';
    }

    function getRowDisplayName(row){
        var id = row.id || row.item_id || '';
        var sn = row.sn || row.name || '';
        if (id && sn) return id + ' / ' + sn;
        if (id) return id;
        if (sn) return sn;
        return '(空行)';
    }

    function refreshRowSelect(){
        el.rowSelect.innerHTML = '';
        for (var i = 0; i < state.rows.length; i++){
            var opt = document.createElement('option');
            opt.value = String(i);
            opt.textContent = getRowDisplayName(state.rows[i]).slice(0, 80);
            el.rowSelect.appendChild(opt);
        }
        if (state.rows.length){
            state.selectedRowIndex = Math.min(state.selectedRowIndex, state.rows.length - 1);
            el.rowSelect.value = String(state.selectedRowIndex);
        } else {
            state.selectedRowIndex = 0;
        }
    }

    function refreshColSelect(){
        el.colSelect.innerHTML = '';
        for (var i = 0; i < state.headers.length; i++){
            var opt = document.createElement('option');
            opt.value = String(i);
            opt.textContent = state.headers[i] || '(空)';
            el.colSelect.appendChild(opt);
        }
        if (state.headers.length){
            state.selectedColIndex = Math.min(state.selectedColIndex, state.headers.length - 1);
            el.colSelect.value = String(state.selectedColIndex);
        } else {
            state.selectedColIndex = 0;
        }
        refreshColList();
    }

    function refreshColList(){
        el.colList.innerHTML = '';
        for (var i = 0; i < state.headers.length; i++){
            var key = state.headers[i];
            var item = document.createElement('div');
            item.className = 'colItem';

            var nm = document.createElement('div');
            nm.className = 'colName';
            nm.textContent = key;

            var meta = document.createElement('div');
            meta.className = 'meta';
            meta.textContent = FIELD_HINTS[key] || '（未定义提示）';

            // 以列为单位渲染一个“快捷删除按钮”，但 id 列不可删
            var btn = document.createElement('button');
            btn.type = 'button';
            btn.className = 'danger';
            btn.textContent = (key === 'id') ? 'id 保留' : '删';
            btn.disabled = key === 'id';
            btn.style.padding = '6px 10px';
            btn.addEventListener('click', function(k){
                return function(){
                    deleteColumnByName(k);
                };
            }(key));

            item.appendChild(nm);
            item.appendChild(meta);
            item.appendChild(btn);
            el.colList.appendChild(item);
        }
    }

    function renderRowEditor(){
        el.rowEditor.innerHTML = '';
        if (!state.rows.length) return;
        var row = state.rows[state.selectedRowIndex];
        if (!row) return;

        for (var i = 0; i < state.headers.length; i++){
            (function(){
                var key = state.headers[i];
                var hint = FIELD_HINTS[key] || '';

                var wrap = document.createElement('div');
                wrap.className = 'field';

                var lab = document.createElement('label');
                lab.textContent = key + (hint ? ('  ' + hint) : '');

                var ta = document.createElement('textarea');
                ta.value = row[key] == null ? '' : String(row[key]);
                ta.addEventListener('input', function(){
                    row[key] = ta.value;
                });

                wrap.appendChild(lab);
                wrap.appendChild(ta);
                el.rowEditor.appendChild(wrap);
            })();
        }
    }

    function loadCsvText(csvText, loadedFrom){
        clearError();
        var parsed = parseCsv(csvText);
        state.headers = parsed.headers || [];
        state.rows = parsed.rows || [];
        state.selectedRowIndex = 0;
        state.selectedColIndex = 0;

        refreshRowSelect();
        refreshColSelect();
        renderRowEditor();

        el.statusLine.textContent = '已加载：' + (loadedFrom || 'CSV') + ' | 行数=' + state.rows.length + ' | 列数=' + state.headers.length;
        el.exportHint.textContent = '';
    }

    function loadFromFile(file){
        clearError();
        if (!file) return;
        var reader = new FileReader();
        reader.onload = function(){
            loadCsvText(String(reader.result || ''), file.name);
        };
        reader.onerror = function(){
            showError('读取文件失败');
        };
        reader.readAsText(file);
    }

    function loadFromUrl(url){
        clearError();
        fetch(url).then(function(r){
            if (!r.ok) throw new Error('fetch 失败: ' + r.status);
            return r.text();
        }).then(function(t){
            loadCsvText(t, url);
        }).catch(function(e){
            showError(String(e && e.message ? e.message : e));
        });
    }

    function addColumn(){
        var name = String(el.newColName.value || '').trim();
        if (!name){
            showError('请输入新字段名');
            return;
        }
        if (state.headers.indexOf(name) >= 0){
            showError('该字段名已存在：' + name);
            return;
        }
        var def = String(el.newColDefault.value || '');
        state.headers.push(name);
        for (var i = 0; i < state.rows.length; i++){
            state.rows[i][name] = def;
        }
        el.newColName.value = '';
        el.newColDefault.value = '';
        refreshColSelect();
        renderRowEditor();
        clearError();
    }

    function deleteColumnByIndex(colIndex){
        if (colIndex == null) colIndex = state.selectedColIndex;
        var key = state.headers[colIndex];
        if (!key) return;
        deleteColumnByName(key);
    }

    function deleteColumnByName(colName){
        if (colName === 'id') return;
        var idx = state.headers.indexOf(colName);
        if (idx < 0) return;
        state.headers.splice(idx, 1);
        for (var i = 0; i < state.rows.length; i++){
            delete state.rows[i][colName];
        }
        // 选中列保持在有效范围
        state.selectedColIndex = Math.max(0, Math.min(state.selectedColIndex, state.headers.length - 1));
        refreshColSelect();
        renderRowEditor();
    }

    function addRow(){
        var row = {};
        for (var i = 0; i < state.headers.length; i++){
            row[state.headers[i]] = '';
        }
        // 自动给 id/ item_id 一个空值占位，便于用户填
        state.rows.push(row);
        state.selectedRowIndex = state.rows.length - 1;
        refreshRowSelect();
        renderRowEditor();
    }

    function exportCsv(){
        var csv = stringifyCsv(state.headers, state.rows);
        var base = 'items_edit_export_' + new Date().toISOString().slice(0,19).replace(/[:T]/g,'-');
        download(base + '.csv', csv, 'text/csv;charset=utf-8');
        el.exportHint.textContent = '已导出 CSV：' + base + '.csv';
    }

    function exportItemsJsonSimplified(){
        // 简化目标：把 CSV 每行转换为 items.json 里 tpl 的形状
        // keys: item_id/name/weight_kg + 其余字段原样保留（尽量不破坏扩展性）
        var out = {};
        for (var i = 0; i < state.rows.length; i++){
            var r = state.rows[i];
            var itemId = r.id || r.item_id || '';
            if (!itemId){
                continue;
            }
            var tpl = {};
            // 基础身份
            tpl.item_id = String(itemId);
            tpl.id = String(itemId);
            tpl.name = r.sn || r.name || '';

            // 重量字段：优先 weight_kg，其次 weight
            var weightKg = r.weight_kg;
            if ((weightKg == null || weightKg === '') && r.weight != null && r.weight !== ''){
                weightKg = r.weight;
            }
            if (weightKg != null && weightKg !== ''){
                var num = parseFloat(weightKg);
                tpl.weight_kg = isNaN(num) ? weightKg : num;
            }

            // 其它字段原样复制，便于你后续在运行时/规则里扩展
            for (var h = 0; h < state.headers.length; h++){
                var key = state.headers[h];
                if (key === 'id') continue;
                tpl[key] = r[key];
            }
            out[itemId] = tpl;
        }

        download('items_export_simplified_' + new Date().toISOString().slice(0,19).replace(/[:T]/g,'-') + '.json', JSON.stringify(out, null, 2), 'application/json;charset=utf-8');
        el.exportHint.textContent = '已导出简化 items.json（不保证与当前运行时字段完全一致，适合做后续对接基底）。';
    }

    // ---------- 事件 ----------
    el.fileInput.addEventListener('change', function(){
        if (el.fileInput.files && el.fileInput.files[0]) loadFromFile(el.fileInput.files[0]);
    });
    el.rowSelect.addEventListener('change', function(){
        state.selectedRowIndex = parseInt(el.rowSelect.value, 10) || 0;
        renderRowEditor();
    });
    el.colSelect.addEventListener('change', function(){
        state.selectedColIndex = parseInt(el.colSelect.value, 10) || 0;
    });
    el.btnAddCol.addEventListener('click', function(){ addColumn(); });
    el.btnDeleteCol.addEventListener('click', function(){ deleteColumnByIndex(); });
    el.btnNewRow.addEventListener('click', function(){ addRow(); });
    el.btnExportCsv.addEventListener('click', function(){ exportCsv(); });
    el.btnExportItemsJson.addEventListener('click', function(){ exportItemsJsonSimplified(); });

    el.btnLoadMaterials.addEventListener('click', function(){
        // 从 tools/ 相对 data/ 读取
        loadFromUrl('../data/items/materials_base.csv');
    });

    // 给页面一个轻量默认状态：也可以在未来改成加载其它表
    el.statusLine.textContent = '未加载 CSV（你可以选择本地文件，或点“载入示例”）';
})();
</script>
</body>
</html>
