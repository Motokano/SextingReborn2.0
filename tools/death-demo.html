<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>死亡与复活 · 演示</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0;height:100%;background:#111a19;color:#e1e7df;font:14px system-ui,sans-serif}
    body{display:flex;flex-direction:column}header{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:14px 22px;border-bottom:1px solid #364740;background:#18231f}
    h1{font:600 18px "Microsoft YaHei",sans-serif;margin:0 0 5px}#status{color:#a9b9ad;font-size:12px;margin:0}
    .controls{display:flex;align-items:center;gap:12px;flex-wrap:wrap}label{display:flex;align-items:center;gap:8px;font-size:12px;color:#bbc9be}
    input,button{font:inherit;color:inherit;border:1px solid #53675b;border-radius:5px;background:#202f28;padding:9px 12px}input{width:100px}button{cursor:pointer}button:hover{background:#344b3e}button:disabled{opacity:.45;cursor:default}
    #start{background:#45634f;border-color:#698570}main{flex:1;min-height:0;position:relative}iframe{border:0;width:100%;height:100%;display:block;background:#101615}
    #loading{position:absolute;inset:0;display:grid;place-items:center;background:#111a19;color:#a9b9ad}#loading[hidden]{display:none}
    body.playing header{display:none}body.playing iframe{height:100dvh}
    @media(max-width:640px){header{padding:12px;gap:12px;align-items:flex-start;flex-direction:column}.controls{gap:8px}input{width:75px}button{padding:9px}h1{font-size:16px}}
  </style>
  <script src="death-demo.js" defer></script>
</head>
<body>
  <header>
    <div><h1>死亡与复活</h1><p id="status" role="status">独立演示 · 仅在本页内存中运行</p></div>
    <div class="controls">
      <label>本次死亡编号 <input id="number" type="number" value="1" min="1" max="999999999" step="1" disabled></label>
      <button id="start" disabled>模拟死亡</button>
      <button id="reset">重新开始</button>
    </div>
  </header>
  <main>
    <iframe id="game" title="死亡流程演示" sandbox="allow-scripts allow-same-origin"></iframe>
    <div id="loading" role="status">正在准备演示…</div>
  </main>
</body>
</html>
