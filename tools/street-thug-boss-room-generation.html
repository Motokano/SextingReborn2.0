<main><h1>地牢 · 完整地图预览</h1><p>查看整层布局，点击全景中的地点可近看。墙地、容器、家具和人物使用当前游戏素材。</p>
<nav><label>地图种子 <input id="seed" value="fixed-den-review-1" aria-label="地图种子"></label><button id="generate" disabled>重新生成第四层</button><button id="next" disabled>换一个种子</button><button id="scale" disabled>正常大小 · 查看区域全景</button><button id="inside" disabled>查看屋内</button><button id="outside" disabled>站到门外</button><button id="sight" disabled>布局总览 · 切换真实视野</button><button id="searched" disabled>切换搜空 / 已用状态</button></nav>
