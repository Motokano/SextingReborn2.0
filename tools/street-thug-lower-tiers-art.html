<script src="js/core/map-projection.js"></script>
<script type="module">
const root='assets/map/isometric/';
const specs={
 standing:{src:'street-thug-v1/standing.png',crop:[230,38,757,1216],anchor:[609.5,1253]},
 'tier-1':{src:'street-thug-lower-tiers-defeated-v1/tier-1.png',crop:[103,110,1358,844],anchor:[782,950]},
 'tier-2':{src:'street-thug-lower-tiers-defeated-v1/tier-2.png',crop:[44,255,1449,630],anchor:[768.5,881]}
};
const projection=MapProjection.create({width:3,height:3},144/Math.SQRT2,'isometric');
const center=projection.cellCenter(1,1),scale=46/757*1.25;
try{
 await Promise.all(Object.entries(specs).map(async([id,spec])=>{
  const image=new Image();image.src=root+spec.src;await image.decode();
  const canvas=document.getElementById(id),dpr=window.devicePixelRatio||1;
  canvas.width=Math.round(320*dpr);canvas.height=Math.round(240*dpr);
  const ctx=canvas.getContext('2d');ctx.scale(dpr,dpr);ctx.save();ctx.translate(160-center.x,143-center.y);
  for(let y=0;y<3;y++)for(let x=0;x<3;x++){
   const points=projection.cellPolygon(x,y);ctx.beginPath();points.forEach((p,i)=>ctx[i?'lineTo':'moveTo'](p.x,p.y));ctx.closePath();
   ctx.fillStyle=(x+y)%2?'#4d5b4e':'#465346';ctx.fill();ctx.strokeStyle='#a1ad8f55';ctx.stroke();
  }
  const points=projection.cellPolygon(1,1);ctx.beginPath();points.forEach((p,i)=>ctx[i?'lineTo':'moveTo'](p.x,p.y));ctx.closePath();ctx.strokeStyle='#c7b67b';ctx.stroke();
  const [bx,by,bw,bh]=spec.crop,[ax,ay]=spec.anchor;
  ctx.drawImage(image,bx,by,bw,bh,center.x+(bx-ax)*scale,center.y+10+(by-ay)*scale,bw*scale,bh*scale);
  ctx.restore();
 }));
 document.getElementById('status').textContent='实际尺寸对照 · 144px棋格，人物125%';
}catch(error){document.getElementById('status').textContent='素材载入失败：'+error.message;console.error(error);}
</script>
