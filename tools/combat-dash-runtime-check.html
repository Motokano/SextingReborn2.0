<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>地痞三档 · 正式箭步验收</title>
<style>body{margin:0;background:#19241f;color:#ecdfc2;font:14px 'Microsoft YaHei',sans-serif}header{padding:16px 24px}h1{font-size:23px;margin:0 0 8px}p{line-height:1.7;color:#bac4af;margin:6px 0}button,select{background:#364b40;color:#f2dfb2;border:1px solid #74866c;padding:8px 12px;border-radius:5px;margin:4px}button{cursor:pointer}iframe{width:100%;height:760px;border:0}#status{color:#edd09a;min-height:26px}a{color:#ceba80}</style>
<header><h1>三档地痞 · 真实行动与箭步</h1><p>使用正式地牢、真实AI与战斗结算。此页使用独立内存，不读写你的游戏存档。</p>
<select id="tier" aria-label="敌人档位"><option value="1">混混 · 60级</option><option value="2">打手 · 80级</option><option value="3" selected>老练狠角色 · 100级</option></select>
<select id="scene" aria-label="试招路线"><option value="straight">直线</option><option value="detour">绕过低矮障碍</option></select>
<button id="reset">重新就位</button><button id="step">推进1 tick</button><button id="empty">零气力／底气试招</button><button id="injury">单腿失能试招</button><button id="freeze">定格箭步中途</button>
<p id="status">正在载入…</p><p id="events">点击推进1 tick，让敌人自己决定行动。</p>
<p><a href="street-thug-boss-room-generation.html?no_reload&seed=thug-runtime-v1&floor=4&view=dungeon" target="_blank">查看完整第四层与独立人数</a></p></header><iframe id="game" src="street-thug-boss-room-game.html?no_reload"></iframe>
<script type="module">
import {prepareThugScene,advanceThugScene} from './fixtures/street-thug-live.mjs';
const $=id=>document.getElementById(id);let g,prepared,locked=false,events=[];
try{
 const f=$('game');await new Promise(resolve=>f.onload=resolve);g=f.contentWindow;await g.AppBoot.ready;await g.DungeonRuntime.ready;
 g.CharacterAttributes.setState({character_creation_completed:true});g.document.getElementById('character-creation-overlay')?.classList.add('hidden');g.MapProjection.setMode('isometric');
 new g.ResizeObserver(()=>g.SceneRenderer.render()).observe(g.document.getElementById('map-container'));
 const advanceClock=g.CombatFxRuntime.advancePlaybackClock;g.CombatFxRuntime.advancePlaybackClock=t=>locked?g.CombatFxRuntime.getPlaybackTime():advanceClock(t);
 g.SceneAnimation.on('combat:dash',e=>events.push('箭步沿路线移动 '+(e.path.length-1)+' 格'));
 g.SceneAnimation.on('combat:resolved',e=>events.push('正常出招：'+({swing_punch:'摆拳',poke_eye:'戳眼',kick_knee:'踹膝',shove:'推搡'}[e.segments?.[0]?.moveId]||'已结算')));
 function show(){const b=g.CombatEnemies.thugInfo(prepared.id,prepared.mapId,0),q=g.CombatEnemies.getEnemyQi(prepared.id,prepared.mapId,0),t=g.GameTime.getState().totalTicks;
  $('status').textContent=`${g.CombatEnemies.getById(prepared.id).name} · 气力 ${q.current}/100 · 底气 ${b.diqi}/${g.CombatEnemies.getById(prepared.id).thug.diqi_max} · 箭步冷却 ${Math.max(0,b.dashReadyTick-t)} tick`;
  $('events').textContent=events.join(' → ')||'已就位，等待推进。';
 }
 function reset(extra={}){locked=false;g.CombatFxRuntime.startPlaybackClock();events=[];prepared=prepareThugScene(g,{scene:$('scene').value,tier:Number($('tier').value),...extra});show();}
 function step(){locked=false;advanceThugScene(g);show();}
 $('reset').onclick=()=>reset();$('tier').onchange=()=>reset();$('scene').onchange=()=>reset();$('step').onclick=step;
 $('empty').onclick=()=>{reset({empty:true});step();};$('injury').onclick=()=>{reset({injured:true});step();};
 $('freeze').onclick=()=>{reset();step();const e=g.CombatFxDashRuntime.getEntries()[0];if(e){g.CombatFxRuntime.startPlaybackClock(e.start+(e.end-e.start)*.6);locked=true;g.SceneRenderer.render();}};
 reset();
}catch(e){$('status').textContent='加载失败：'+e.message;console.error(e);}
</script></html>
