<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>农田 · 界面试玩</title></head>
<body style="background:#111b17;color:#d6d0bc;font:14px system-ui;padding:40px">正在走进农田…
<script>
// Three UI variants inside the real game shell; all storage and actions are memory-only.
(async () => {
  const root = new URL('../', location.href);
  function isolate() {
    const storage = () => { const m = new Map(); return { getItem: k => m.get(String(k)) ?? null, setItem: (k,v) => m.set(String(k),String(v)), removeItem: k => m.delete(String(k)), clear: () => m.clear(), key: i => [...m.keys()][i] ?? null, get length() { return m.size; } }; };
    Object.defineProperty(window, 'localStorage', { value: storage() });
    Object.defineProperty(window, 'sessionStorage', { value: storage() });
    Object.defineProperty(navigator, 'locks', { value: undefined, configurable: true });
    Object.defineProperty(window, 'BroadcastChannel', { value: undefined, configurable: true });
    window.__AGRICULTURE_UI_MEMORY__ = true;
    window.__AGRICULTURE_UI_READY__ = new Promise(resolve => { window.AppBoot = { afterReady: [resolve] }; });
  }
  let html = await (await fetch(new URL('index.html?no_reload', root))).text();
  html = html.replace(/<link\b[^>]*href="https:\/\/fonts\.[^>]*>/gi, '');
  html = html.replace('<head>', '<head><base href="' + root.href + '"><script>(' + isolate.toString() + ')();<\/script>');
  html = html.replace('</body>', '<link rel="stylesheet" href="tools/agriculture-ui-prototype.css"><script type="module" src="tools/agriculture-ui-prototype.mjs"><\/script></body>');
  document.open(); document.write(html); document.close();
})().catch(error => { document.body.textContent = '农田暂未加载，请刷新重试。'; console.error(error); });
</script></body></html>
