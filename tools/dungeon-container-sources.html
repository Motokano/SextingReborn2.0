<!doctype html><html lang="zh-CN"><meta charset="utf-8"><base href="../"><title>容器原图与接地点复核</title><style>body{background:#c2bdad;color:#25231e;font:14px sans-serif;margin:16px}header{display:flex;gap:16px}main{display:grid;grid-template-columns:repeat(2,570px);gap:12px}article{background:#999b8b}h2{font-size:16px;margin:8px}img{width:280px;height:280px;object-fit:contain}button{padding:8px}</style><header><button id="prev">上一组</button><span id="status"></span><button id="next">下一组</button></header><main></main><script type="module">
const data=await fetch('assets/dungeon/containers-v2/production.json').then(r=>r.json());let page=+(new URLSearchParams(location.search).get('page')||0);const overrides={'discarded-toolbox':'discarded-toolbox-clean','reused-fridge-searched':'reused-fridge-searched-right'};
function render(){document.querySelector('main').replaceChildren();document.querySelector('#status').textContent=`原图 ${page+1} / 8 · 每幅画布 280px，不做变形`;for(const p of data.items.slice(page*4,page*4+4)){const el=document.createElement('article'),h=document.createElement('h2');h.textContent=p.name+' · '+p.file;el.append(h);for(const f of [p.file,p.file+'-searched']){const im=document.createElement('img');im.src='assets/dungeon/containers-v2/'+(overrides[f]||f)+'.png';im.alt=f;el.append(im);}document.querySelector('main').append(el);}}
document.querySelector('#prev').onclick=()=>{page=Math.max(0,page-1);render()};document.querySelector('#next').onclick=()=>{page=Math.min(7,page+1);render()};render();</script>
