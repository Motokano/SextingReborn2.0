<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><base href="../"><title>健身房</title><link rel="icon" href="data:,"><link rel="stylesheet" href="tools/gym-prototype.css"><link rel="stylesheet" href="css/npc-menu.css"></head>
<body>
<header class="hud"><h1>健身房</h1><div id="resources" class="resources"></div><div class="hud-actions"><button id="muscles">肌群</button><details id="demo-settings"><summary>试玩设置</summary><div class="settings-body"><label>情境<select id="scenario"><option value="fresh">从零开始</option><option value="built">器械齐备</option><option value="maxed">器械满级</option><option value="near">肩带即将练满</option><option value="tired">疲劳65</option><option value="low">体力不足</option></select></label><button id="reset">重置</button><button id="supply">补充物资</button></div></details></div></header>
<main id="scene" aria-label="健身房场景"><div id="map-viewport"><div id="world"><canvas id="board" aria-label="健身房棋盘"></canvas><div id="pawns"></div></div></div><button id="active-job" hidden></button><div id="notice" role="status" aria-live="polite" hidden></div></main>
<dialog id="interaction" aria-labelledby="interaction-title"><header class="window-head"><h2 id="interaction-title"></h2><button id="close" aria-label="关闭">×</button></header><div id="window-content"></div></dialog>
<script>const previewStorage=new Map();Object.defineProperty(window,'localStorage',{value:{getItem:k=>previewStorage.get(k)??null,setItem:(k,v)=>previewStorage.set(k,String(v)),removeItem:k=>previewStorage.delete(k)}});</script>
<script src="js/food-metabolism.js"></script><script src="js/game-time.js"></script><script src="js/survival.js"></script><script src="js/muscles.js"></script><script src="js/dungeon/ui-icons.js"></script><script src="js/npc-system.js"></script><script src="js/gym-facility.js"></script><script src="js/core/tile-renderer-v2.js"></script><script type="module" src="tools/gym-prototype.mjs"></script>
</body></html>
