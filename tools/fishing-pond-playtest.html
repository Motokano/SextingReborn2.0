<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>首塘试玩 · 真实钓组</title><link rel="stylesheet" href="../css/fishing.css"><style>body{background:#17241d;color:#e7e3d5;font:15px/1.7 system-ui;margin:40px}button{padding:12px;margin:5px;background:#334e3f;color:#eee;border:1px solid #9b9468;border-radius:6px}#readout{max-width:900px;white-space:pre-wrap}.fishing-window details{margin-top:15px}.item-assembly-slot{border-left:1px solid #64745f;padding:5px;margin:5px}.item-assembly-children{padding-left:8px}</style></head><body>
<h1>首塘试玩</h1><p>这里使用正式钓鱼代码与物品目录，库存和存档仅留在本页内存，不改动游戏存档。每次重新试玩恢复上午九时、初始工具与鱼情。</p><button id="start" disabled>开始试玩</button><button id="lure-start" disabled>路亚试玩</button><button id="resume" disabled>恢复本页最近快照并打开</button><pre id="readout">正在载入……</pre>
<script src="../js/ui-text.js"></script><script src="../js/item-attribute-modules.js"></script><script src="../js/inventory-equipment.js"></script><script src="../js/item-assembly.js"></script><script src="../js/item-assembly-display.js"></script><script src="../js/hideout-warehouse.js"></script><script src="../js/fishing-session.js"></script><script src="../js/fishing-facts.js"></script><script src="../js/fishing-feedback.js"></script><script src="../js/fishing-pond.js"></script><script src="../js/fishing-panel.js"></script>
<script>
(async function(){
const get=async p=>{const r=await fetch('../data/'+p);if(!r.ok)throw Error(p);return r.json();};
const [items,session,pond,dict,factRules,feedbackRules]=await Promise.all(['item-catalog-v2.json','fishing-session-config.json','fishing-pond.json','ui_text_zhCN.json','fishing-facts.json','fishing-feedback.json'].map(get));
const I=InventoryEquipment,W=HideoutWarehouse,F=FishingSession,P=FishingPond;let ticks=54,stamina=100,checkpoint=null;
UIText.setDict(dict);window.GameEngine={getState:()=>({mapId:pond.entry.map,x:pond.entry.x,y:pond.entry.y})};
window.GameTime={getState:()=>({totalTicks:ticks,hour:Math.floor(ticks/6)%24,display:'第 '+Math.floor(ticks/144+1)+' 天 '+String(Math.floor(ticks/6)%24).padStart(2,'0')+':'+String(ticks%6*10).padStart(2,'0')+' · 体力 '+stamina})};
window.Survival={getState:()=>({stamina}),getStamina:()=>stamina,consumeStamina:n=>{stamina-=n;},advanceTick:()=>{ticks++;W.tickSpoilage();}};
window.SceneApp={isPreCreationGameplayRestricted:()=>false,isPlayerActionDisabledByBuff:()=>false};
window.SaveSystem={saveNow:()=>{checkpoint=JSON.parse(JSON.stringify({i:I.getState(),w:W.getState(),f:F.getState(),p:P.getState(),ticks,stamina}));document.getElementById('resume').disabled=false;document.getElementById('readout').textContent='快照已保存在本页内存。\n'+GameTime.getState().display+'\n当前随身物品：'+I.getState().inventory_backpack.filter(Boolean).map(x=>I.getDisplayName(I.getItemTemplate(x.item_id),0)+' ×'+(x.count||1)).join('、');}};
I.setConfig({equipment:{test_bag:{item_id:'test_bag',equip_slot:'backpack',backpack_slots:30}},items:ItemAttributeModules.hydrateCatalog(items),modules:{},default_equipment:{}});
W.setUpgradeTable({base_capacity:40,base_free_qol_ids:['deposit_auto_stack','withdraw_to_character_default_order']});F.configure(session);pond.fact_rules=factRules;pond.feedback_rules=feedbackRules;FishingPanel.configure(pond);
function start(lure){F.setState(null);P.setState(null);ticks=54;stamina=100;I.setState({equipment:{backpack:{item_id:'test_bag'}},inventory_backpack:[],inventory_pocket:[],inventory_vest:[],ground_items:{}});W.setState(W.createDefaultState());P.grantStarter();W.getState().slots.forEach((x,i)=>{if(x)W.withdrawSlot(i);});if(lure){const piece=(id,connections)=>({item_id:id,count:1,connections:connections||{}});I.putItemIntoDefaultContainer(piece('fishing_rod_lure_basic',{reel:piece('fishing_reel_basic',{main_line:piece('fishing_line_braid_fixed',{leader:piece('fishing_leader_lure_wire',{lure:piece('fishing_lure_frog')})})})}));}
const rod=I.getState().inventory_backpack.find(x=>x&&x.item_id===(lure?'fishing_rod_lure_basic':'fishing_rod_hand_basic'));P.act('select',rod.instance_id);FishingPanel.open();}
document.getElementById('start').disabled=false;document.getElementById('start').onclick=()=>start(false);document.getElementById('lure-start').disabled=false;document.getElementById('lure-start').onclick=()=>start(true);document.getElementById('resume').onclick=()=>{const x=checkpoint;F.setState(null);I.setState(x.i);W.setState(x.w);F.setState(x.f);P.setState(x.p);ticks=x.ticks;stamina=x.stamina;FishingPanel.open();};document.getElementById('readout').textContent='就绪：初始物资会从沙盒仓库转到随身背包。';
})().catch(e=>{document.getElementById('readout').textContent='初始化失败：'+e.stack;});
</script></body></html>
