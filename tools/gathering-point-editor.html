<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>采集点实例编辑器 - 潮碧物语</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; font-family: sans-serif; background: #1a1a1a; color: #e0e0e0; padding: 16px; }
        h1 { font-size: 18px; margin: 0 0 12px 0; }
        .toolbar { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; align-items: center; }
        button { padding: 8px 12px; background: #404040; border: 1px solid #555; color: #fff; border-radius: 4px; cursor: pointer; }
        button:hover { background: #505050; }
        .layout { display: flex; gap: 16px; flex-wrap: wrap; }
        .col { flex: 1; min-width: 280px; }
        label { display: block; font-size: 12px; color: #999; margin: 8px 0 4px 0; }
        input, select { width: 100%; padding: 6px 8px; background: #333; border: 1px solid #555; color: #fff; border-radius: 4px; }
        table { width: 100%; border-collapse: collapse; font-size: 12px; margin-top: 8px; }
        th, td { border: 1px solid #444; padding: 6px; text-align: left; }
        th { background: #2d2d2d; color: #aaa; }
        .hint { font-size: 11px; color: #666; margin-top: 8px; line-height: 1.4; }
        textarea.raw { width: 100%; min-height: 200px; font-family: monospace; font-size: 11px; background: #222; color: #ccc; border: 1px solid #444; border-radius: 4px; padding: 8px; }
        .cell-item-wrap .cell-item-input { width: 100%; margin-bottom: 0; }
        .items-status { font-size: 12px; color: #888; margin-left: 8px; }
    </style>
</head>
<body>
    <h1>采集点实例编辑器</h1>
    <p class="hint">编辑 <code>data/gathering_point_instances.json</code>：实例可被地图格 <code>gathering_instance_id</code> 引用；每行掉落为 <code>item_id + weight</code>（稀有度由物品身份承担，品质系统已移除）。<strong>掉落物品</strong>与仓库 <code>data/items.json</code> 联动：先载入物品表，再在可搜索输入框中筛选 <code>item_id</code>（仍可手填未入库 id）。保存后请将 JSON 覆盖到仓库 <code>data/gathering_point_instances.json</code>。</p>
    <div class="toolbar">
        <button type="button" id="btn-fetch-items">载入 items.json</button>
        <button type="button" id="btn-file-items">选择物品 JSON</button>
        <span class="items-status" id="items-status">物品表：未载入</span>
    </div>
    <input type="file" id="inp-file-items" accept=".json,application/json" style="display:none" />
    <div class="toolbar">
        <button type="button" id="btn-fetch">从 data/gathering_point_instances.json 拉取</button>
        <button type="button" id="btn-file">选择本地 JSON 文件</button>
        <button type="button" id="btn-new-inst">新建实例</button>
        <button type="button" id="btn-del-inst">删除当前实例</button>
        <button type="button" id="btn-add-row">掉落表 +1 行</button>
        <button type="button" id="btn-download">下载完整 JSON</button>
    </div>
    <input type="file" id="inp-file" accept=".json,application/json" style="display:none" />

    <div class="layout">
        <div class="col">
            <label>当前实例</label>
            <select id="sel-instance"></select>
            <label>instance_id</label>
            <input type="text" id="fld-instance-id" />
            <label>map_entity_id（地图视觉键，如 gathering_bush）</label>
            <input type="text" id="fld-map-entity" />
            <label>wild_interaction_category</label>
            <select id="fld-category">
                <option value="gathering">gathering（徒手采集，当前游戏已接）</option>
                <option value="mining">mining</option>
                <option value="logging">logging</option>
                <option value="hunting">hunting</option>
                <option value="fishing">fishing</option>
            </select>
            <label>display_name</label>
            <input type="text" id="fld-display" />
            <label>base_gathering_success_rate（0～1）</label>
            <input type="number" id="fld-base" step="0.05" min="0" max="1" />
            <label>stamina_cost</label>
            <input type="number" id="fld-stamina" step="1" min="0" />
            <label><input type="checkbox" id="fld-tool" /> tool_required</label>
        </div>
        <div class="col">
            <label>defaults（map_entity_id → 默认实例 id，JSON 对象）</label>
            <textarea class="raw" id="ta-defaults" placeholder='{ "gathering_bush": "gp_std_bush" }'></textarea>
            <label>掉落表 loot_rows</label>
            <table>
                <thead><tr><th>物品（items.json）</th><th>weight</th><th></th></tr></thead>
                <tbody id="loot-tbody"></tbody>
            </table>
        </div>
    </div>
    <label style="margin-top:16px;">完整 JSON 预览</label>
    <textarea class="raw" id="ta-full" readonly></textarea>
    <datalist id="loot-item-options"></datalist>

    <script>
(function () {
    var data = { defaults: {}, instances: {} };
    var itemsCatalog = {};

    function setItemsStatus(text) {
        var el = document.getElementById('items-status');
        if (el) el.textContent = text;
    }

    function applyItemsJson(j) {
        if (!j || typeof j !== 'object') {
            setItemsStatus('物品表：解析失败');
            return;
        }
        itemsCatalog = j;
        var n = Object.keys(itemsCatalog).filter(function (k) { return k && k.charAt(0) !== '_'; }).length;
        setItemsStatus('物品表：已载入 ' + n + ' 条（data/items.json）');
        refreshItemDatalist();
        var id = document.getElementById('sel-instance').value;
        if (id && data.instances[id]) loadFormFromSelection();
    }

    function fetchItems() {
        return fetch('../data/items.json')
            .then(function (r) { return r.ok ? r.json() : Promise.reject(); })
            .catch(function () {
                return fetch('data/items.json').then(function (r2) { return r2.ok ? r2.json() : Promise.reject(); });
            })
            .then(function (j) { applyItemsJson(j); })
            .catch(function () {
                setItemsStatus('物品表：拉取失败（请从仓库根起 HTTP 服务或「选择物品 JSON」）');
            });
    }

    function syncSelect() {
        var sel = document.getElementById('sel-instance');
        var cur = sel.value || '';
        sel.innerHTML = '';
        var ids = Object.keys(data.instances || {});
        ids.sort();
        for (var i = 0; i < ids.length; i++) {
            var opt = document.createElement('option');
            opt.value = ids[i];
            opt.textContent = ids[i];
            sel.appendChild(opt);
        }
        if (cur && data.instances[cur]) sel.value = cur;
        else if (ids.length) sel.value = ids[0];
        loadFormFromSelection();
    }

    function loadFormFromSelection() {
        var id = document.getElementById('sel-instance').value;
        var inst = id && data.instances[id];
        if (!inst) {
            document.getElementById('fld-instance-id').value = '';
            document.getElementById('loot-tbody').innerHTML = '';
            return;
        }
        document.getElementById('fld-instance-id').value = inst.instance_id || id;
        document.getElementById('fld-map-entity').value = inst.map_entity_id || '';
        document.getElementById('fld-category').value = inst.wild_interaction_category || 'gathering';
        document.getElementById('fld-display').value = inst.display_name || '';
        document.getElementById('fld-base').value = inst.base_gathering_success_rate != null ? inst.base_gathering_success_rate : 0.6;
        document.getElementById('fld-stamina').value = inst.stamina_cost != null ? inst.stamina_cost : 2;
        document.getElementById('fld-tool').checked = !!inst.tool_required;
        document.getElementById('ta-defaults').value = JSON.stringify(data.defaults || {}, null, 2);
        var tb = document.getElementById('loot-tbody');
        tb.innerHTML = '';
        var rows = inst.loot_rows || [];
        for (var r = 0; r < rows.length; r++) addLootRowEl(rows[r]);
        refreshFullJson();
    }

    function refreshItemDatalist() {
        var list = document.getElementById('loot-item-options');
        if (!list) return;
        list.innerHTML = '';
        var ids = Object.keys(itemsCatalog).filter(function (k) {
            return k && String(k).charAt(0) !== '_' && itemsCatalog[k] && typeof itemsCatalog[k] === 'object';
        });
        ids.sort(function (a, b) {
            var na = (itemsCatalog[a].name || a) + a;
            var nb = (itemsCatalog[b].name || b) + b;
            return na.localeCompare(nb, 'zh-Hans');
        });
        for (var i = 0; i < ids.length; i++) {
            var oid = ids[i];
            var tpl = itemsCatalog[oid];
            var o = document.createElement('option');
            o.value = oid;
            o.label = (tpl.name || oid) + ' (' + oid + ')';
            list.appendChild(o);
        }
    }

    function addLootRowEl(row) {
        row = row || { item_id: '', weight: 10 };
        var tr = document.createElement('tr');
        var tdItem = document.createElement('td');
        tdItem.className = 'cell-item-wrap';
        var inpItem = document.createElement('input');
        inpItem.type = 'text';
        inpItem.className = 'cell-item-input';
        inpItem.setAttribute('list', 'loot-item-options');
        inpItem.placeholder = '搜索或输入 item_id';
        inpItem.value = row.item_id || '';
        inpItem.addEventListener('input', function () { saveFormToData(); refreshFullJson(); });
        inpItem.addEventListener('change', function () { saveFormToData(); refreshFullJson(); });
        tdItem.appendChild(inpItem);

        var tdW = document.createElement('td');
        tdW.innerHTML = '<input type="number" class="cell-w" step="1" min="0" value="' + (row.weight != null ? row.weight : 10) + '" />';
        var tdDel = document.createElement('td');
        var btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'btn-row-del';
        btn.textContent = '删';
        btn.onclick = function () { tr.remove(); saveFormToData(); refreshFullJson(); };
        tdDel.appendChild(btn);
        tr.appendChild(tdItem);
        tr.appendChild(tdW);
        tr.appendChild(tdDel);
        tr.querySelectorAll('.cell-w').forEach(function (inp) {
            inp.addEventListener('input', function () { saveFormToData(); refreshFullJson(); });
        });
        document.getElementById('loot-tbody').appendChild(tr);
    }

    function readLootRowsFromDom() {
        var tb = document.getElementById('loot-tbody');
        var out = [];
        var trs = tb.querySelectorAll('tr');
        for (var i = 0; i < trs.length; i++) {
            var tr = trs[i];
            var inpItem = tr.querySelector('.cell-item-input');
            var item_id = inpItem ? String(inpItem.value || '').trim() : '';
            if (!item_id) continue;
            out.push({
                item_id: item_id,
                weight: Number(tr.querySelector('.cell-w').value) || 0
            });
        }
        return out;
    }

    function saveFormToData() {
        var selId = document.getElementById('sel-instance').value;
        if (!selId || !data.instances[selId]) return;
        try {
            data.defaults = JSON.parse(document.getElementById('ta-defaults').value || '{}');
        } catch (e) {
            return;
        }
        var inst = data.instances[selId];
        inst.instance_id = (document.getElementById('fld-instance-id').value || '').trim() || selId;
        inst.map_entity_id = (document.getElementById('fld-map-entity').value || '').trim();
        inst.wild_interaction_category = document.getElementById('fld-category').value || 'gathering';
        inst.display_name = (document.getElementById('fld-display').value || '').trim();
        inst.base_gathering_success_rate = Number(document.getElementById('fld-base').value);
        inst.stamina_cost = parseInt(document.getElementById('fld-stamina').value, 10) || 0;
        inst.tool_required = document.getElementById('fld-tool').checked;
        inst.loot_rows = readLootRowsFromDom();
        if (inst.instance_id !== selId) {
            data.instances[inst.instance_id] = inst;
            delete data.instances[selId];
            syncSelect();
            document.getElementById('sel-instance').value = inst.instance_id;
        }
    }

    function refreshFullJson() {
        saveFormToData();
        document.getElementById('ta-full').value = JSON.stringify(data, null, 2);
    }

    document.getElementById('sel-instance').addEventListener('change', loadFormFromSelection);

    ['fld-instance-id', 'fld-map-entity', 'fld-display', 'fld-base', 'fld-stamina', 'fld-category', 'fld-tool', 'ta-defaults'].forEach(function (id) {
        var el = document.getElementById(id);
        if (el) el.addEventListener('input', function () { saveFormToData(); refreshFullJson(); });
        if (el && el.type === 'checkbox') el.addEventListener('change', function () { saveFormToData(); refreshFullJson(); });
    });

    document.getElementById('btn-add-row').onclick = function () {
        addLootRowEl();
        saveFormToData();
        refreshFullJson();
    };

    document.getElementById('btn-new-inst').onclick = function () {
        var nid = window.prompt('新实例 id（如 gp_my_vein）', 'gp_new_' + Date.now().toString(36));
        if (!nid || !nid.trim()) return;
        nid = nid.trim();
        if (data.instances[nid]) { window.alert('已存在'); return; }
        data.instances[nid] = {
            instance_id: nid,
            map_entity_id: 'gathering_bush',
            wild_interaction_category: 'gathering',
            display_name: nid,
            base_gathering_success_rate: 0.6,
            stamina_cost: 2,
            tool_required: false,
            loot_rows: [{ item_id: 'herb_green', weight: 10 }]
        };
        syncSelect();
        document.getElementById('sel-instance').value = nid;
        loadFormFromSelection();
    };

    document.getElementById('btn-del-inst').onclick = function () {
        var id = document.getElementById('sel-instance').value;
        if (!id || !window.confirm('删除实例 ' + id + ' ?')) return;
        delete data.instances[id];
        syncSelect();
        refreshFullJson();
    };

    document.getElementById('btn-download').onclick = function () {
        saveFormToData();
        var str = JSON.stringify(data, null, 2);
        var blob = new Blob([str], { type: 'application/json' });
        var a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'gathering_point_instances.json';
        a.click();
        URL.revokeObjectURL(a.href);
    };

    document.getElementById('btn-fetch-items').onclick = function () { fetchItems(); };

    document.getElementById('btn-file-items').onclick = function () {
        document.getElementById('inp-file-items').click();
    };
    document.getElementById('inp-file-items').onchange = function () {
        var f = this.files && this.files[0];
        if (!f) return;
        var reader = new FileReader();
        reader.onload = function () {
            try {
                applyItemsJson(JSON.parse(String(reader.result || '')));
            } catch (e) {
                window.alert('物品 JSON 解析失败');
                setItemsStatus('物品表：解析失败');
            }
        };
        reader.readAsText(f, 'utf-8');
        this.value = '';
    };

    document.getElementById('btn-fetch').onclick = function () {
        fetch('../data/gathering_point_instances.json').then(function (r) { return r.ok ? r.json() : Promise.reject(); })
            .then(function (j) {
                data.defaults = j.defaults || {};
                data.instances = j.instances || {};
                syncSelect();
                refreshFullJson();
            })
            .catch(function () {
                fetch('data/gathering_point_instances.json').then(function (r) { return r.ok ? r.json() : Promise.reject(); })
                    .then(function (j) {
                        data.defaults = j.defaults || {};
                        data.instances = j.instances || {};
                        syncSelect();
                        refreshFullJson();
                    })
                    .catch(function () { window.alert('拉取失败：请用本地 HTTP 打开 tools 目录的上一级，或改用「选择本地 JSON」'); });
            });
    };

    document.getElementById('btn-file').onclick = function () { document.getElementById('inp-file').click(); };
    document.getElementById('inp-file').onchange = function () {
        var f = this.files && this.files[0];
        if (!f) return;
        var reader = new FileReader();
        reader.onload = function () {
            try {
                var j = JSON.parse(String(reader.result || ''));
                data.defaults = j.defaults || {};
                data.instances = j.instances || {};
                syncSelect();
                refreshFullJson();
            } catch (e) { window.alert('解析失败'); }
        };
        reader.readAsText(f, 'utf-8');
    };

    document.getElementById('btn-fetch').click();
    fetchItems();
})();
    </script>
</body>
</html>
