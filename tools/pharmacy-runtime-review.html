<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>制药台 · 当前界面</title>
<style>html,body{height:100%;margin:0;overflow:hidden;background:#171310;color:#e6dac8;font:14px 'Microsoft YaHei',sans-serif}iframe{width:100%;height:100%;display:block;border:0}#loading{position:fixed;inset:0;display:grid;place-items:center;background:#171310}#loading[hidden]{display:none}</style>
</head>
<body><iframe id="game" title="制药台正式界面"></iframe><div id="loading">正在打开制药台…</div>
<script>
(async function () {
    const frame = document.getElementById('game'), loading = document.getElementById('loading');
    const injectionPreview = new URLSearchParams(location.search).get('injection') === '1';
    function isolate() {
        try {
            function memoryStorage() {
                const entries = new Map();
                return { getItem: k => entries.get(String(k)) ?? null, setItem: (k,v) => entries.set(String(k),String(v)),
                    removeItem: k => entries.delete(String(k)), clear: () => entries.clear(),
                    key: i => Array.from(entries.keys())[i] ?? null, get length() { return entries.size; } };
            }
            Object.defineProperty(window, 'localStorage', { value: memoryStorage() });
            Object.defineProperty(window, 'sessionStorage', { value: memoryStorage() });
            Object.defineProperty(navigator, 'locks', { value: undefined });
            window.__PHARMACY_REVIEW_MEMORY__ = true;
        } catch (error) {
            document.open(); document.write('<p>试玩初始化失败，请关闭此页。</p>'); document.close(); throw error;
        }
    }
    try {
        const root = new URL('../', location.href);
        const response = await fetch(new URL('index.html?no_reload', root));
        if (!response.ok) throw new Error('无法加载当前游戏界面');
        let html = await response.text();
        html = html.replace(/<link\b[^>]*href="https:\/\/fonts\.[^>]*>/gi, '');
        html = html.replace(/<head>/i, '<head><base href="' + root.href + '"><script>(' + isolate.toString() + ')();<\/script>');
        const loaded = new Promise(resolve => frame.addEventListener('load', resolve, { once: true }));
        frame.srcdoc = html;
        await loaded;
        const g = frame.contentWindow;
        if (!g.__PHARMACY_REVIEW_MEMORY__ || !g.AppBoot?.ready) throw new Error('试玩未能初始化');
        await g.AppBoot.ready;
        let steps = 0;
        while (g.DialogueUI.isDialogueOpen() && steps++ < 1000) g.DialogueUI.next();
        await new Promise(resolve => setTimeout(resolve, 50));
        g.SceneApp.openCharacterCreationAfterIntro();
        if (!g.SceneApp.creation.confirm({ name: '制药台试玩', height: 178, gender: 'male', hand: 'right', leg: 'right' })) throw new Error('试玩角色初始化失败');
        await new Promise(resolve => setTimeout(resolve, 50));
        g.NPCSystem.setDemoFlag('npc_station_pharmacy_base_repaired', true);
        g.NPCSystem.setDemoFlag('pharmacy_injection_unlocked', injectionPreview);
        const ie = g.InventoryEquipment;
        const recipes = g.PharmacyStation.getRecipes();
        // Seed one learned recipe in this memory-only preview to show the recipe list.
        const exampleRecipe = recipes.find(r => r.recipe_id === 'life_pharmacy.crush_cannabis_powder');
        if (exampleRecipe) g.PharmacyStation.markRecipeKnown(exampleRecipe.recipe_id);
        const ids = injectionPreview ? ['solvent_water_pure', 'med_antler_powder', 'med_antler_powder_purified', 'med_antler_powder_refined']
            : [...new Set(recipes.filter(r => r.method_id === 'life_pharmacy.crushing').flatMap(r => r.inputs.map(i => i.item_id)))].slice(0, 8);
        let bag;
        if (g.BackpackSystem) bag = g.BackpackSystem.generate('eq_backpack_light_canvas', []);
        else {
            const equipment = await (await fetch(new URL('data/equipment.json', root))).json();
            equipment.pharmacy_review_bag = { id: 'pharmacy_review_bag', name_0: '试玩背包', equip_slot: 'backpack', backpack_slots: 30, backpack_weight_factor: 1 };
            ie.setConfig({ equipment });
            bag = { item_id: 'pharmacy_review_bag', count: 1 };
        }
        const state = ie.getState();
        const tools = ['tool_rolling_pin_pharmacy', 'tool_mortar_pharmacy'].map(item_id => ({ item_id, count: 1 }));
        const supplies = [...ids.map(item_id => ({ item_id, count: 10 })), ...tools];
        ie.setState({ ...state, equipment: { ...state.equipment, backpack: bag }, inventory_backpack: supplies });
        const station = g.PharmacyStation.getState();
        station.fuel_points = 0;
        station.installed_accessory_item_ids = ['tool_rolling_pin_pharmacy'];
        g.GameEngine.setState('M0_Base_Inside_lv_1', 13, 14);
        g.Survival.setState({ thirst: 100, dirtyness: 0 });
        g.PharmacyStationPanel.open();
        if (!g.PharmacyStationPanel.isOpen()) throw new Error('制药台未能打开');
        const crushing = g.document.querySelector('[data-method-id="life_pharmacy.crushing"]');
        if (crushing) crushing.click();
        g.SceneApp.render();
        loading.hidden = true;
        frame.focus();
    } catch (error) { loading.textContent = '打开失败：' + error.message; console.error(error); }
})();
</script></body></html>
