<script type="module">
import {ROOM_SCALE} from './tools/street-thug-boss-room-scale.mjs';
const root='assets/dungeon/street-thug-boss-room-v6/';
try{
 const m=await fetch(root+'manifest.json').then(r=>r.json()),rows=m.props.map(p=>({...p,label:ROOM_SCALE[p.id].label}));
 for(const c of m.containers)for(const [state,label]of [['unsearched','未搜'],['searched','搜空']])rows.push({...c[state],label:ROOM_SCALE[c.id].label+' · '+label});

 for(const p of rows){const card=document.createElement('article');card.className='card';const img=document.createElement('img');img.src=root+p.src;img.alt=p.label;const h=document.createElement('h2');h.textContent=p.label;const note=document.createElement('p');note.textContent=p.footprint?'底面 '+p.footprint.join(' × ')+' 格 · 原始透明图，显示校准见实际棋盘':'平面材质 · 沿真实墙面／地面投影';card.append(img,h,note);document.getElementById('assets').append(card);}
 document.getElementById('status').textContent='14 张选用素材 · 人物保持原样 · 棋盘页可查看格线、朝向和人物比例';
}catch(e){document.getElementById('status').textContent='载入失败：'+e.message;}
