<body>

  <aside id="settings" hidden aria-label="试玩设置"></aside>

  <nav class="prototype-switcher" aria-label="原型方案切换"><button data-variant="-1" aria-label="上一个方案">←</button><span id="variant-label"></span><button data-variant="1" aria-label="下一个方案">→</button></nav>
